# Éditeur de plateformes : lignes de chat. %pad% est l’id de la plateforme.
pad-added: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Plateforme de lancement {highlight}%pad%{letters} ajoutée.'
pad-removed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Plateforme de lancement {highlight}%pad%{letters} supprimée.'
pad-changed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Plateforme de lancement {highlight}%pad%{letters} mise à jour.'
same-place: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}Il y a déjà une plateforme sur ce bloc.'

# Invites de l’éditeur de plateformes.
prompt-power: '{letters}Vitesse horizontale de cette plateforme (0.1 à 8).'
prompt-vertical: '{letters}Vitesse verticale de cette plateforme (0.1 à 4).'
confirm-remove: Supprimer la plateforme de lancement {highlight}%pad%{letters} ?

# Éditeur de plateformes : textes des cartes.
list-title: Mouvement
list-kind: Plateforme de lancement
row-subtitle: Projette celui qui marche dessus
label-place: Bloc
label-power: Puissance
label-vertical: Hauteur
label-direction: Direction
direction-look: '{info}Là où tu regardes'

# La direction d’une plateforme fixe. %yaw% est l’angle en degrés.
direction-fixed: '{info}Fixe à %yaw%°'
clicks:
- '{primary}{icon:click} Clic gauche {letters_black}· {letters}modifier la puissance'
- '{primary}{icon:right_click} Clic droit {letters_black}· {letters}modifier la hauteur'
- '{primary}{icon:click} Shift + clic gauche {letters_black}· {letters}l’orienter ou le libérer'
- '{error}{icon:right_click} Shift + clic droit {letters_black}· {letters}supprimer'
- '{letters_black}La suppression demande confirmation.'
add-pad-title: Plateforme de lancement
add-pad-text:
- ' {letters}Clique le bloc à transformer en'
- ' {letters}plateforme ; elle lance les joueurs'
- ' {letters}dans leur direction.'
add-pad-click: Clique pour commencer
add-pad-next: Modifie ensuite sa puissance ici.
add-aimed-title: Plateforme orientée
add-aimed-text:
- ' {letters}Place-toi sur le bloc, regarde où'
- ' {letters}il doit lancer et fais'
- ' {highlight}Shift + clic{letters}.'
add-aimed-click: Clique pour commencer
add-aimed-next: Lance toujours dans ce sens.
back-name: Mouvement

# Ce que les assistants nomment à l’écran (texte brut, sans couleurs).
wizard-pad: Plateforme de lancement
wizard-aimed: Plateforme orientée
wizard-aim: Direction de la plateforme
