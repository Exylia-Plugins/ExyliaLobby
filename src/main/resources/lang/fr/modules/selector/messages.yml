# Lignes de chat. %server% est le nom du serveur dans le catalogue (ou son id).
connecting: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Connexion à %server%{letters}...'
offline: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}%server%{error} est hors ligne pour le moment.'
no-permission: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}Tu ne peux pas rejoindre %server%{error}.'
here: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {warning}Tu es déjà sur %server%{warning}.'
unreachable: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}Le réseau est injoignable. Réessaie dans un instant.'
unknown-server: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}Ce serveur n’est pas configuré.'

# Lignes d’une carte de serveur. Les mots d’état et l’invite de clic (deux lignes, jointes par <nl>).
status-online: '{success}En ligne'
status-offline: '{error}Hors ligne'
status-unknown: '{muted}Pas de données'
click-join: '{info}{icon:click} Clique pour rejoindre<nl>{letters_black}Tu es déplacé aussitôt.'
click-locked: '{warning}{icon:locked} Verrouillé<nl>{letters_black}Il faut un grade pour rejoindre.'
click-offline: '{error}{icon:off} Hors ligne<nl>{letters_black}Réessaie dans un instant.'
click-here: '{success}{icon:on} Tu es ici<nl>{letters_black}Choisis un autre lobby pour changer.'
no-lobbies: '{warning}{icon:warning} Aucun lobby défini<nl>{letters_black}Demande à un admin de les lister.'
lobbies-next: '{info}{icon:click} Clique pour ouvrir<nl>{letters_black}Choisis le lobby où jouer.'

