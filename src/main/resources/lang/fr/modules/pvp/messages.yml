# Boss bars pendant que le kit s’active ou se retire. %seconds% est le temps restant.
equip-bar: '{success}&lÉQUIPEMENT {letters_black}» {letters}Garde ton épée en main {letters_black}({info}%seconds%s{letters_black})'
unequip-bar: '{error}&lRETRAIT {letters_black}» {letters}Range ton épée {letters_black}({info}%seconds%s{letters_black})'

# Lignes de chat. %seconds% est le temps de combat restant, %victim%, %killer% et %streak% nomment le combat.
equipped: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {success}Tu es dans le combat.{letters} Seuls les joueurs avec leur épée en main peuvent te frapper.'
unequipped: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Tu es hors du combat et tes affaires sont revenues.'
tagged: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}Tu es en combat pendant {highlight}%seconds%s{error}. Garde ton épée en main.'
no-permission: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}Tu ne peux pas te battre dans le lobby.'
busy-elsewhere: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {warning}Tu ne peux pas te battre pendant une autre activité.'
killer: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Tu as tué {highlight}%victim%{letters}. Série de {accent}%streak%{letters}.'
victim: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {letters}Tu as été tué par {highlight}%killer%{letters}.'
quit-killer: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {highlight}%victim%{letters} a quitté en plein combat. Série de {accent}%streak%{letters}.'
streak-reward: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {success}Récompense de série{letters} pour {accent}%streak%{letters} kills.'

# L’épée que chaque joueur tient dans le lobby : son nom et le lore de sa carte.
sword-name: '{letters}PvP {letters_black}▸ <gradient:{error}:{error_light}>Épée</gradient>'
sword-lore:
- '{letters_black}PvP du lobby'
- ''
- '{error}✎ Information'
- ' {letters}Tiens-la pour combattre les'
- ' {letters}joueurs qui ont fait pareil.'
- ''
- '{error}{icon:click} Tiens pour combattre'
- '{letters_black}Ton kit s’équipe après une courte attente.'

# Le tableau hologramme du classement. %rank%, %name% et %kills% remplissent chaque ligne.
board-title: '{primary}&lTOP KILLS'
board-row: '{highlight}%rank%. {letters}%name% {letters_black}· {info}%kills%'
board-empty: '{muted}Personne n’a encore gagné de combat.'

# Ce que répond un placeholder de top pour un rang que personne n’occupe encore.
top-empty: '-'

# Écran d’admin : les zones.
list-title: PvP du lobby
list-kind: Zone PvP
subtitle-zone: Zone PvP
label-place: Position
label-size: Taille
clicks-zone:
- '{primary}{icon:click} Clic gauche {letters_black}· {letters}voir son contour'
- '{error}{icon:right_click} Shift + clic droit {letters_black}· {letters}supprimer'
- '{letters_black}La suppression demande confirmation.'
add-zone-title: Zone
add-zone-text:
- ' {letters}Sélectionne une zone ; le kit'
- ' {letters}s’équipe quand on y entre.'
add-zone-click: Clique pour sélectionner
add-zone-next: En sortir retire le kit.
add-here-title: Autour de toi
add-here-text:
- ' {letters}Une zone de 13x13 blocs'
- ' {letters}centrée sur ta position.'
add-here-click: Clique pour ajouter
add-here-next: Redimensionne-la dans la config.
select-zone: '{letters}Sélectionne la zone avec la hache dorée : {highlight}clic gauche{letters} sur un coin, {highlight}clic droit{letters} sur l’autre, puis {highlight}shift + clic gauche{letters}.'
added: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {highlight}%what%{letters} ajouté.'
removed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {highlight}%what%{letters} supprimé.'
confirm-remove: Supprimer {highlight}%what%{letters} ?
spawn-set: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Réapparition PvP définie à ta position.'
board-set: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Hologramme du top placé à ta position.'
