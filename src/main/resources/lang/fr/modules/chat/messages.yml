# Un joueur a essayé de parler alors que le chat est verrouillé
locked: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}Le chat est verrouillé.'

# Un joueur a parlé trop tôt. %seconds% est l’attente restante.
slow-denied: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}Attends {highlight}%seconds%s{error} avant de reparler.'

# Envoyé au lobby quand le chat est verrouillé ou déverrouillé. %player% est l’auteur.
lock-on: '%prefix% {highlight}%player%{letters} a verrouillé le chat.'
lock-off: '%prefix% {highlight}%player%{letters} a déverrouillé le chat.'

# Envoyé au lobby quand le mode lent change. %seconds% est le nouveau délai.
slow-on: '%prefix% {letters}Mode lent activé : un message toutes les {highlight}%seconds%s{letters}.'
slow-off: '%prefix% {letters}Mode lent désactivé.'

# Envoyé au lobby après le nettoyage du chat
cleared: '%prefix% {letters}Le chat a été nettoyé.'
