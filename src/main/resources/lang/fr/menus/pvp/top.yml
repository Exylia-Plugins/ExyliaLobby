menu-version: 2
# Le top des kills du PvP du lobby. À toi de le restyler : les nouveaux défauts attendent dans /exylialib updates.

title: '{primary}&lKILLS {letters_black}» {highlight}PvP du lobby {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Plus de joueurs'
    lore:
      - "{letters_black}Gagne un combat pour figurer ici."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: 'playerhead-%row_name%'
    name: "{letters}Rang {letters_black}▸ <gradient:{highlight}:{warning_light}>#%row_rank% %row_name%</gradient>"
    lore:
      - "{letters_black}Classement · Kills"
      - ""
      - "{highlight}♦ Record"
      - "  {letters_black}· {success}{icon:kills} {letters}Kills{letters_black}: {success}%row_kills%"
      - "  {letters_black}· {error}{icon:deaths} {letters}Morts{letters_black}: {error}%row_deaths%"
      - "  {letters_black}· {info}{icon:star} {letters}Ratio{letters_black}: {info}%row_ratio%"
      - "  {letters_black}· {accent}{icon:heart} {letters}Meilleure série{letters_black}: {accent}%row_best%"

  navigation:
    previous:
      slot: 48
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Précédente</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Suivante →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  summary:
    slot: 49
    material: 'playerhead-%player_name%'
    name: "{letters}PvP du lobby {letters_black}▸ <gradient:{primary}:{secondary_light}>Ton record</gradient>"
    lore:
      - "{letters_black}Tes combats"
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {highlight}{icon:star} {letters}Rang{letters_black}: {highlight}%my_rank%"
      - "  {letters_black}· {success}{icon:kills} {letters}Kills{letters_black}: {success}%my_kills%"
      - "  {letters_black}· {error}{icon:deaths} {letters}Morts{letters_black}: {error}%my_deaths%"
      - "  {letters_black}· {accent}{icon:heart} {letters}Série{letters_black}: {accent}%my_streak%"
      - "  {letters_black}· {accent}{icon:star} {letters}Meilleure série{letters_black}: {accent}%my_best%"
