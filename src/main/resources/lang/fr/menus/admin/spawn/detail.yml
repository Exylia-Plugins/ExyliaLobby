# NE PAS MODIFIER — RÉGÉNÉRÉ À CHAQUE DÉMARRAGE.
#
# Le module spawn : définis le point de spawn, teste-le et modifie les zones du lobby.

title: '{primary}&lSPAWN {letters_black}» {highlight}Config'
size: 27

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: RED_BED
    name: "<gradient:{primary}:{secondary_light}>Spawn</gradient>"
    lore:
      - "{letters_black}Module spawn"
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:map} {letters}Monde{letters_black}: {info}%spawn_world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Spawn ici{letters_black}: %spawn_state%"

  set:
    slot: 12
    material: LIME_BED
    name: "{letters}Spawn {letters_black}▸ <gradient:{success}:{success_light}>Définir le spawn</gradient>"
    lore:
      - "{letters_black}Point de spawn"
      - ""
      - "{success}✎ Information"
