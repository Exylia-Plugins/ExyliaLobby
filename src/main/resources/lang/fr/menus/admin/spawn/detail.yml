      - "{primary}{icon:click} Clique pour ouvrir"
      - "{letters_black}Ajoute un monde ou une zone."
    actions:
      - 'exylialobby:spawn_areas'

  teleport:
    slot: 18
    material: ENDER_PEARL
    name: "{letters}Spawn {letters_black}▸ <gradient:{info}:{info_light}>Téléportation</gradient>"
    lore:
