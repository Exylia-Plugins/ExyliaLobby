      - "{success}{icon:click} Clique pour commencer"
      - "{letters_black}Remplace le spawn du monde."
    actions:
      - 'exylialobby:spawn_set'

  areas:
    slot: 14
    material: FILLED_MAP
    name: "{letters}Spawn {letters_black}▸ <gradient:{primary}:{secondary_light}>Zones du lobby</gradient>"
