menu-version: 1
# NE PAS MODIFIER — RÉGÉNÉRÉ À CHAQUE DÉMARRAGE.
#
# Les zones du lobby : les mondes et zones où les règles du lobby s’appliquent.

title: '{primary}&lZONES {letters_black}» {highlight}Lobby {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Plus de zones'
    lore:
      - "{letters_black}Ajoute un monde ou une zone ci-dessous."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: '%area_icon%'
    name: "{letters}Zone {letters_black}▸ <gradient:{primary}:{secondary_light}>%area_name%</gradient>"
    lore:
      - "{letters_black}%area_kind_label%"
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:map} {letters}Monde{letters_black}: {info}%area_world%"
      - "  {letters_black}· {info}{icon:redstone} {letters}%area_state_label%{letters_black}: %area_state%"
      - ""
      - "{error}{icon:right_click} Clic droit {letters_black}· {letters}supprimer"
      - "{letters_black}Une confirmation te sera demandée."
    actions:
      - 'right: exylialobby:spawn_area_remove %area_kind% %area_id%'

  navigation:
    previous:
      slot: 48
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Précédente</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Suivante →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  add_box:
    slot: 45
    material: GOLDEN_AXE
    name: "{letters}Zone {letters_black}▸ <gradient:{success}:{success_light}>Ajouter une zone</gradient>"
    lore:
      - "{letters_black}Zone du lobby"
      - ""
      - "{success}✎ Information"
      - " {letters}Sélectionne deux coins avec la"
      - " {letters}hache dorée ; les règles du lobby"
      - " {letters}s’appliquent dans cette zone."
      - ""
      - "{success}{icon:click} Clique pour sélectionner"
      - "{letters_black}Tu nommes ensuite la zone."
    actions:
      - 'exylialobby:spawn_area_add_box'

  add_world:
    slot: 46
    material: GRASS_BLOCK
    name: "{letters}Zone {letters_black}▸ <gradient:{success}:{success_light}>Ajouter ce monde</gradient>"
    lore:
      - "{letters_black}Zone du lobby"
      - ""
      - "{success}✎ Information"
      - " {letters}Le monde entier où tu te tiens"
      - " {letters}devient {highlight}lobby{letters}."
      - ""
      - "{success}{icon:click} Clique pour ajouter"
      - "{letters_black}Effet immédiat, sans redémarrage."
    actions:
      - 'exylialobby:spawn_area_add_world'

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Retour {letters_black}▸ <gradient:{error}:{error_light}>%back_name%</gradient>"
    lore:
      - "{error}{icon:click} Clique pour revenir"
    actions:
      - 'exylialobby:spawn_areas_back'
