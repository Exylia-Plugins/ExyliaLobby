# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The hud settings an admin tunes. Everything else is in
# modules/hud/config.yml.

title: "{primary}&lPARAMÈTRES {letters_black}» {highlight}HUD"
size: 27
