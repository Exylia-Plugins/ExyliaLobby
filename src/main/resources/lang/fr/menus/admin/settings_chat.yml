# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The chat settings an admin tunes. Everything else is in
# modules/chat/config.yml.

title: "{primary}&lPARAMÈTRES {letters_black}» {highlight}Chat"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: WRITABLE_BOOK
    name: "<gradient:{primary}:{secondary_light}>Chat</gradient>"
    lore:
      - "{letters_black}Réglages de Chat"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Contrôle du chat dans le lobby :"
      - " {letters}verrou, mode lent et nettoyage."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:redstone} {letters}Module{letters_black}: %chat_state%"

  locked-at-start:
    slot: 12
    material: IRON_DOOR
    name: "{letters}Chat {letters_black}▸ <gradient:{primary}:{secondary_light}>Verrouillé au démarrage</gradient>"
    lore:
      - "{letters_black}Réglage de Chat"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Démarre avec le chat verrouillé. Un"
      - " {letters}redémarrage revient à ceci."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:redstone} {letters}Activé{letters_black}: %chat_locked_at_start%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %chat_locked_at_start_default%"
      - ""
      - "%chat_locked_at_start_click%"
    actions:
      - "exylialobby:setting chat locked-at-start"

  slow-mode-seconds:
    slot: 13
    material: COBWEB
    name: "{letters}Chat {letters_black}▸ <gradient:{primary}:{secondary_light}>Mode lent</gradient>"
    lore:
      - "{letters_black}Réglage de Chat"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Secondes entre deux messages d'un"
      - " {letters}joueur. {highlight}0 {letters}désactive."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:clock} {letters}Délai{letters_black}: %chat_slow_mode_seconds%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %chat_slow_mode_seconds_default%"
      - ""
      - "%chat_slow_mode_seconds_click%"
    actions:
      - "exylialobby:setting chat slow-mode-seconds"

  clear-lines:
    slot: 14
    material: PAPER
    name: "{letters}Chat {letters_black}▸ <gradient:{primary}:{secondary_light}>Lignes de nettoyage</gradient>"
    lore:
      - "{letters_black}Réglage de Chat"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Combien de lignes vides envoie"
      - " {letters}la commande de nettoyage."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:book} {letters}Lignes{letters_black}: %chat_clear_lines%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %chat_clear_lines_default%"
      - ""
      - "%chat_clear_lines_click%"
    actions:
      - "exylialobby:setting chat clear-lines"

