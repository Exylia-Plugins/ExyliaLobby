menu-version: 1
# NE PAS MODIFIER — RÉGÉNÉRÉ À CHAQUE DÉMARRAGE.
#
# Chaque module d’ExyliaLobby : active-le en direct, ou ouvre ses réglages.

title: '{primary}&lLOBBY {letters_black}» {highlight}Modules {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Plus de modules'
    lore:
      - "{letters_black}Tous les modules sont listés ici."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: '%module_icon%'
    glow: '%module_glow%'
    name: "{letters}Module {letters_black}▸ <gradient:{primary}:{secondary_light}>%module_name%</gradient>"
    lore:
      - "{letters_black}Module du lobby"
      - ""
      - "{primary}✎ Information"
      - "%module_description%"
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:redstone} {letters}État{letters_black}: %module_state%"
      - ""
      - "{primary}{icon:click} Clic gauche {letters_black}· {letters}activer ou désactiver"
      - "{letters_black}Effet immédiat, sans redémarrage."
      - "{primary}{icon:right_click} Clic droit {letters_black}· {letters}ouvrir"
      - "{letters_black}Son écran ou ses réglages."
    actions:
      - 'left: exylialobby:module_toggle %module_id%'
      - 'right: exylialobby:module_open %module_id%'

  navigation:
