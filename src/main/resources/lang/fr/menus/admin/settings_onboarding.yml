  journey:
    slot: 12
    material: WRITTEN_BOOK
    name: "{letters}Intégration {letters_black}▸ <gradient:{primary}:{secondary_light}>Parcours</gradient>"
    lore:
      - "{letters_black}Réglage de Intégration"
      - ""
      - "{primary}✎ Informations"
      - " {letters}L'id du parcours ExyliaJourney"
      - " {letters}qui accueille les joueurs."
