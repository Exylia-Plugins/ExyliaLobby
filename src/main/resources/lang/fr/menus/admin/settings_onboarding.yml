    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: FILLED_MAP
    name: "<gradient:{primary}:{secondary_light}>Intégration</gradient>"
    lore:
      - "{letters_black}Réglages de Intégration"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Comment les nouveaux joueurs sont"
      - " {letters}confiés à ExyliaJourney."
      - ""
      - "{primary}✦ Statut"
