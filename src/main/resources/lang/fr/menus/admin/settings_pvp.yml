# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The lobby pvp settings an admin tunes. Everything else is in
# modules/pvp/config.yml.

title: "{primary}&lPARAMÈTRES {letters_black}» {highlight}PvP du lobby"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
