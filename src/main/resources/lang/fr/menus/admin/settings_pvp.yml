  header:
    slot: 4
    material: DIAMOND_SWORD
    name: "<gradient:{primary}:{secondary_light}>PvP du lobby</gradient>"
    lore:
      - "{letters_black}Réglages de PvP"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Fonctionnement du PvP du lobby :"
      - " {letters}équipement et étiquette de combat."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:redstone} {letters}Module{letters_black}: %pvp_state%"

  equip-seconds:
    slot: 11
    material: IRON_SWORD
    name: "{letters}PvP {letters_black}▸ <gradient:{primary}:{secondary_light}>Temps d'équipement</gradient>"
    lore:
      - "{letters_black}Réglage de PvP"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Secondes avec l'épée en main"
      - " {letters}avant de recevoir le kit."
      - ""
      - "{primary}✦ Statut"
