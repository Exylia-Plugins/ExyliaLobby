    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: OAK_SIGN
    name: "<gradient:{primary}:{secondary_light}>Messages de connexion</gradient>"
    lore:
      - "{letters_black}Réglages de Connexion"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Qui voit quel message de"
      - " {letters}connexion et départ, et quand."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:redstone} {letters}Module{letters_black}: %join_state%"

  only-in-lobby:
    slot: 12
    material: COMPASS
    name: "{letters}Connexion {letters_black}▸ <gradient:{primary}:{secondary_light}>Seulement dans le lobby</gradient>"
    lore:
      - "{letters_black}Réglage de Connexion"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Ne gère que ceux qui entrent ou"
      - " {letters}sortent depuis le lobby."
      - ""
      - "{primary}✦ Statut"
