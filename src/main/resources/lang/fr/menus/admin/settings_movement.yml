      - " {letters}Poussée horizontale, dans la"
      - " {letters}direction du regard."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:hopper} {letters}Poussée{letters_black}: %movement_double_jump_forward%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %movement_double_jump_forward_default%"
      - ""
      - "%movement_double_jump_forward_click%"
    actions:
