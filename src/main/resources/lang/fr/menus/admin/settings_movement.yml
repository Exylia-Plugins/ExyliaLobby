# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The movement settings an admin tunes. Everything else is in
# modules/movement/config.yml.

title: "{primary}&lPARAMÈTRES {letters_black}» {highlight}Mouvement"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: RABBIT_FOOT
    name: "<gradient:{primary}:{secondary_light}>Mouvement</gradient>"
    lore:
      - "{letters_black}Réglages de Mouvement"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Double saut : jusqu'où il propulse"
      - " {letters}et à quelle fréquence."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:redstone} {letters}Module{letters_black}: %movement_state%"

  double-jump-enabled:
    slot: 11
    material: FEATHER
    name: "{letters}Mouvement {letters_black}▸ <gradient:{primary}:{secondary_light}>Double saut</gradient>"
    lore:
      - "{letters_black}Réglage de Mouvement"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Appuie encore sur saut en l'air"
      - " {letters}pour sauter une seconde fois."
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:redstone} {letters}Activé{letters_black}: %movement_double_jump_enabled%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %movement_double_jump_enabled_default%"
      - ""
      - "%movement_double_jump_enabled_click%"
    actions:
      - "exylialobby:setting movement double-jump.enabled"

  double-jump-forward:
