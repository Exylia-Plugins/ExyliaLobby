    slot: 4
    material: COMPASS
    name: "<gradient:{info}:{info_light}>Serveurs</gradient>"
    lore:
      - "{letters_black}Sélecteur de serveur"
      - ""
      - "{info}✎ Information"
      - " {letters}Choisis un serveur à rejoindre."
      - " {letters}Les effectifs sont en direct."
      - ""
      - "{info}✦ Statut"
      - "  {letters_black}· {letters}En jeu{letters_black}: {info}%total_players%"
