# Linhas de chat. %name% é o nome do holograma.
added: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Holograma {highlight}%name%{letters} adicionado.'
removed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Holograma {highlight}%name%{letters} removido.'
changed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Holograma {highlight}%name%{letters} atualizado.'
moved: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Holograma {highlight}%name%{letters} movido.'

# O prompt do editor de texto. Separe as linhas com <nl>.
prompt-lines: '{letters}As linhas do holograma, separadas por {highlight}<nl>{letters}.'
confirm-remove: Remover o holograma {highlight}%name%{letters}?

# Tela de admin.
list-title: Hologramas
list-kind: Holograma
row-subtitle: Holograma de texto
label-place: Local
label-lines: Linhas
clicks:
- '{primary}{icon:click} Clique esquerdo {letters_black}· {letters}editar o texto'
- '{primary}{icon:right_click} Clique direito {letters_black}· {letters}mover'
- '{error}{icon:right_click} Shift + clique direito {letters_black}· {letters}remover'
- '{letters_black}Remover pede confirmação.'
add-spot-title: Local livre
add-spot-text:
- ' {letters}Vá até o local e faça'
- ' {highlight}Shift + clique{letters}; ele flutua na'
- ' {letters}altura dos seus olhos.'
add-spot-click: Clique para começar
add-spot-next: Depois edite o texto aqui.
add-block-title: Sobre um bloco
add-block-text:
- ' {letters}Clique em um bloco; o holograma'
- ' {letters}flutua sobre ele.'
add-block-click: Clique para começar
add-block-next: Depois edite o texto aqui.

# O que os assistentes nomeiam na tela (texto simples, sem cores).
wizard-spot: Holograma
wizard-block: Bloco do holograma
