menu-version: 2
# A tela de gadgets. Sua para reestilizar: novos padrões aguardam em /exylialib updates.

title: '{primary}&lGADGETS {letters_black}» {highlight}Lobby {muted}%current_page%/%total_pages%'
size: 36
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Sem mais gadgets'
    lore:
      - "{letters_black}Peça à staff para ativar mais."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: '%row_icon%'
    glow: '%row_glow%'
    name: '%row_name%'
    lore:
      - '%row_lore%'
    actions:
      - 'exylialobby:gadgets_equip %row_id%'

  navigation:
    previous:
      slot: 30
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 32
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Próxima →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  header:
    slot: 4
    material: ENDER_CHEST
    name: "<gradient:{primary}:{secondary_light}>Gadgets</gradient>"
    lore:
      - "{letters_black}Brinquedos do lobby"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Equipe um: ele vai para a sua"
      - " {letters}hotbar. O brilhante é o seu."
  equipped:
    slot: 31
    material: ARMOR_STAND
    name: "{letters}Gadget {letters_black}▸ <gradient:{primary}:{secondary_light}>Seu gadget</gradient>"
    lore:
      - "{letters_black}Equipado"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {letters}Gadget{letters_black}: {info}%equipped_name%"
      - ""
      - "%equipped_action%"
    actions:
      - 'exylialobby:gadgets_off'
