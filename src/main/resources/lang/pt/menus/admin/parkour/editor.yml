menu-version: 1
# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# Um percurso de parkour: onde começa, passa e termina, e como é julgado.

title: '{primary}&lPARKOUR {letters_black}» {highlight}%course_id%'
size: 36

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: FEATHER
    name: "{letters}Percurso {letters_black}▸ <gradient:{primary}:{secondary_light}>%course_name%</gradient>"
    lore:
      - "{letters_black}Percurso"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:check} {letters}Estado{letters_black}: %course_state%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Ativo{letters_black}: %enabled%"

  start:
    slot: 11
    material: LIME_BED
    name: "{letters}Percurso {letters_black}▸ <gradient:{success}:{success_light}>Largada</gradient>"
    lore:
      - "{letters_black}Config do percurso"
      - ""
      - "{success}✎ Informação"
      - " {letters}Onde a corrida começa. Usa sua"
      - " {letters}posição e visão."
      - ""
      - "{success}✦ Status"
      - "  {letters_black}· {info}{icon:compass} {letters}Largada{letters_black}: %start_state%"
      - ""
      - "{success}{icon:click} Clique para definir aqui"
      - "{letters_black}Substitui a largada."
    actions:
      - 'exylialobby:parkour_edit start %course_id%'

  checkpoint:
    slot: 12
    material: LIGHT_WEIGHTED_PRESSURE_PLATE
    name: "{letters}Percurso {letters_black}▸ <gradient:{success}:{success_light}>Add checkpoint</gradient>"
    lore:
      - "{letters_black}Config do percurso"
      - ""
      - "{success}✎ Informação"
      - " {letters}Adiciona um checkpoint nos pés."
      - " {letters}Os corredores os passam em ordem."
      - ""
      - "{success}✦ Status"
      - "  {letters_black}· {info}{icon:check} {letters}Checkpoints{letters_black}: {info}%checkpoints%"
      - ""
      - "{success}{icon:click} Clique para adicionar aqui"
      - "{letters_black}Entra depois do último."
    actions:
      - 'exylialobby:parkour_edit checkpoint %course_id%'

  finish:
    slot: 14
    material: WHITE_BANNER
    name: "{letters}Percurso {letters_black}▸ <gradient:{success}:{success_light}>Chegada</gradient>"
    lore:
      - "{letters_black}Config do percurso"
      - ""
      - "{success}✎ Informação"
      - " {letters}Onde a corrida termina. Usa sua"
      - " {letters}posição e visão."
      - ""
      - "{success}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Chegada{letters_black}: %finish_state%"
      - ""
      - "{success}{icon:click} Clique para definir aqui"
      - "{letters_black}Substitui a chegada."
    actions:
      - 'exylialobby:parkour_edit finish %course_id%'

  kill:
    slot: 15
    material: MAGMA_BLOCK
    name: "{letters}Percurso {letters_black}▸ <gradient:{primary}:{secondary_light}>Blocos de queda</gradient>"
    lore:
      - "{letters_black}Config do percurso"
      - ""
      - "{primary}✎ Informação"
      - " {letters}O bloco que você olha manda"
      - " {letters}corredores ao checkpoint."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:barrier} {letters}Blocos{letters_black}: {info}%kills%"
      - ""
      - "{primary}{icon:click} Clique para adicionar bloco"
      - "{letters_black}Olhe para um bloco antes."
    actions:
      - 'exylialobby:parkour_edit kill %course_id%'

  medals:
    slot: 20
    material: GOLD_INGOT
    name: "{letters}Percurso {letters_black}▸ <gradient:{primary}:{secondary_light}>Medalhas</gradient>"
    lore:
      - "{letters_black}Config do percurso"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Tempos-alvo em segundos para"
      - " {letters}ouro, prata e bronze."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:gold} {letters}Metas{letters_black}: {info}%medals%"
      - ""
      - "{primary}{icon:click} Clique para editar"
      - "{letters_black}Pede três números."
    actions:
      - 'exylialobby:parkour_edit medals %course_id%'

  difficulty:
    slot: 21
    material: NETHER_STAR
    name: "{letters}Percurso {letters_black}▸ <gradient:{primary}:{secondary_light}>Dificuldade</gradient>"
    lore:
      - "{letters_black}Config do percurso"
      - ""
      - "{primary}✎ Informação"
      - " {letters}O rótulo mostrado no card."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:crit} {letters}Dificuldade{letters_black}: {info}%difficulty%"
      - ""
      - "{primary}{icon:click} Clique para editar"
      - "{letters_black}Texto livre, como Difícil."
    actions:
      - 'exylialobby:parkour_edit difficulty %course_id%'

  rewards:
    slot: 23
    material: CHEST
    name: "{letters}Percurso {letters_black}▸ <gradient:{primary}:{secondary_light}>Recompensas</gradient>"
    lore:
      - "{letters_black}Config do percurso"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Recompensas de primeira vez e"
      - " {letters}repetição, tempo mínimo e limites."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Editado no arquivo de percursos"
      - ""
      - "{primary}{icon:click} Clique para abrir"
      - "{letters_black}Escolha este percurso lá."
    actions:
      - 'exylialobby:parkour_edit rewards %course_id%'

  enabled:
    slot: 24
    material: LEVER
    name: "{letters}Percurso {letters_black}▸ <gradient:{primary}:{secondary_light}>Ativo</gradient>"
    lore:
      - "{letters_black}Config do percurso"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Ninguém inicia se desativado."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Ativo{letters_black}: %enabled%"
      - ""
      - "{primary}{icon:click} Clique para ativar/desativar"
      - "{letters_black}Muda na hora."
    actions:
      - 'exylialobby:parkour_edit enabled %course_id%'

  board:
    slot: 27
    material: OAK_SIGN
    name: "{letters}Percurso {letters_black}▸ <gradient:{info}:{info_light}>Ranking aqui</gradient>"
    lore:
      - "{letters_black}Holograma"
      - ""
      - "{info}✎ Informação"
      - " {letters}Um holograma de ranking"
      - " {letters}deste percurso nos seus pés."
      - ""
      - "{info}{icon:click} Clique para colocar"
      - "{letters_black}Substitui o ranking dele."
    actions:
      - 'exylialobby:parkour_edit board %course_id%'

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Voltar {letters_black}▸ <gradient:{error}:{error_light}>Percursos</gradient>"
    lore:
      - "{error}{icon:click} Clique para voltar"
    actions:
      - 'exylialobby:parkour_edit back %course_id%'

  delete:
    slot: 35
    material: TNT
    name: "{letters}Percurso {letters_black}▸ <gradient:{error}:{error_light}>Excluir</gradient>"
    lore:
      - "{letters_black}Zona de perigo"
      - ""
      - "{error}✎ Informação"
      - " {letters}Remove o percurso e suas"
      - " {letters}configs. Tempos salvos ficam."
      - ""
      - "{error}{icon:click} Clique para excluir"
      - "{letters_black}Você terá que confirmar."
    actions:
      - 'exylialobby:parkour_edit delete %course_id%'
