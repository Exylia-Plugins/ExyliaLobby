# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The onboarding settings an admin tunes. Everything else is in
# modules/onboarding/config.yml.

title: "{primary}&lAJUSTES {letters_black}» {highlight}Integração"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
