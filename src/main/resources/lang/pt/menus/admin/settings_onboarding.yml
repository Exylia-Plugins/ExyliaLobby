    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: FILLED_MAP
    name: "<gradient:{primary}:{secondary_light}>Integração</gradient>"
    lore:
      - "{letters_black}Ajustes de Integração"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Como os jogadores novos são"
      - " {letters}entregues ao ExyliaJourney."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Módulo{letters_black}: %onboarding_state%"

  journey:
    slot: 12
    material: WRITTEN_BOOK
    name: "{letters}Integração {letters_black}▸ <gradient:{primary}:{secondary_light}>Percurso</gradient>"
    lore:
      - "{letters_black}Ajuste de Integração"
      - ""
      - "{primary}✎ Informação"
      - " {letters}O id do percurso do ExyliaJourney"
      - " {letters}que recebe os jogadores."
