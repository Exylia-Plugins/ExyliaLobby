menu-version: 2
# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# O módulo de spawn: defina o ponto de spawn, teste e edite as áreas do lobby.

title: '{primary}&lSPAWN {letters_black}» {highlight}Configuração'
size: 27

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: RED_BED
    name: "<gradient:{primary}:{secondary_light}>Spawn</gradient>"
    lore:
      - "{letters_black}Módulo de spawn"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:map} {letters}Mundo{letters_black}: {info}%spawn_world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Spawn aqui{letters_black}: %spawn_state%"

  set:
    slot: 12
    material: LIME_BED
    name: "{letters}Spawn {letters_black}▸ <gradient:{success}:{success_light}>Definir spawn</gradient>"
    lore:
      - "{letters_black}Ponto de spawn"
      - ""
      - "{success}✎ Informação"
      - " {letters}Vá ao spawn deste"
      - " {highlight}mundo{letters}, olhe para onde os"
      - " {letters}jogadores olharão e {highlight}Shift + clique{letters}."
      - ""
      - "{success}{icon:click} Clique para começar"
      - "{letters_black}Substitui o spawn deste mundo."
    actions:
      - 'exylialobby:spawn_set'

  areas:
    slot: 14
    material: FILLED_MAP
    name: "{letters}Spawn {letters_black}▸ <gradient:{primary}:{secondary_light}>Áreas do lobby</gradient>"
    lore:
      - "{letters_black}Seção de configuração"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Os mundos e caixas onde"
      - " {letters}as regras do lobby valem."
      - ""
      - "{primary}{icon:click} Clique para abrir"
      - "{letters_black}Adicione um mundo ou caixa."
    actions:
      - 'exylialobby:spawn_areas'

  teleport:
    slot: 18
    material: ENDER_PEARL
    name: "{letters}Spawn {letters_black}▸ <gradient:{info}:{info_light}>Teleportar</gradient>"
    lore:
      - "{letters_black}Teste"
      - ""
      - "{info}{icon:click} Clique para teleportar"
      - "{letters_black}Vá ao spawn deste mundo."
    actions:
      - 'exylialobby:spawn_tp'

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Voltar {letters_black}▸ <gradient:{error}:{error_light}>Módulos</gradient>"
    lore:
      - "{error}{icon:click} Clique para voltar"
    actions:
      - 'exylialobby:admin_modules'
