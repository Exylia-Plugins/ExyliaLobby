menu-version: 1
# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# As áreas do lobby: os mundos e caixas onde as regras do lobby valem.

title: '{primary}&lÁREAS {letters_black}» {highlight}Lobby {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Sem mais áreas'
    lore:
      - "{letters_black}Adicione um mundo ou caixa abaixo."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: '%area_icon%'
    name: "{letters}Área {letters_black}▸ <gradient:{primary}:{secondary_light}>%area_name%</gradient>"
    lore:
      - "{letters_black}%area_kind_label%"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:map} {letters}Mundo{letters_black}: {info}%area_world%"
      - "  {letters_black}· {info}{icon:redstone} {letters}%area_state_label%{letters_black}: %area_state%"
      - ""
      - "{error}{icon:right_click} Clique direito {letters_black}· {letters}remover"
      - "{letters_black}Você terá que confirmar."
    actions:
      - 'right: exylialobby:spawn_area_remove %area_kind% %area_id%'

  navigation:
    previous:
      slot: 48
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Próxima →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  add_box:
    slot: 45
    material: GOLDEN_AXE
    name: "{letters}Área {letters_black}▸ <gradient:{success}:{success_light}>Adicionar caixa</gradient>"
    lore:
      - "{letters_black}Área do lobby"
      - ""
      - "{success}✎ Informação"
      - " {letters}Selecione dois cantos com o"
      - " {letters}machado dourado; as regras"
      - " {letters}do lobby valem nessa caixa."
      - ""
      - "{success}{icon:click} Clique para selecionar"
      - "{letters_black}Depois você dá nome à caixa."
    actions:
      - 'exylialobby:spawn_area_add_box'

  add_world:
    slot: 46
    material: GRASS_BLOCK
    name: "{letters}Área {letters_black}▸ <gradient:{success}:{success_light}>Adicionar este mundo</gradient>"
    lore:
      - "{letters_black}Área do lobby"
      - ""
      - "{success}✎ Informação"
      - " {letters}O mundo inteiro em que você"
      - " {letters}está vira {highlight}lobby{letters}."
      - ""
      - "{success}{icon:click} Clique para adicionar"
      - "{letters_black}Vale na hora, sem reiniciar."
    actions:
      - 'exylialobby:spawn_area_add_world'

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Voltar {letters_black}▸ <gradient:{error}:{error_light}>%back_name%</gradient>"
    lore:
      - "{error}{icon:click} Clique para voltar"
    actions:
      - 'exylialobby:spawn_areas_back'
