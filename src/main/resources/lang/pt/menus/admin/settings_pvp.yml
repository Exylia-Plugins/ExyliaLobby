# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The lobby pvp settings an admin tunes. Everything else is in
# modules/pvp/config.yml.

title: "{primary}&lAJUSTES {letters_black}» {highlight}PvP do lobby"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: DIAMOND_SWORD
    name: "<gradient:{primary}:{secondary_light}>PvP do lobby</gradient>"
    lore:
      - "{letters_black}Ajustes de PvP"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Como funciona o PvP do lobby:"
      - " {letters}equipar e marca de combate."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Módulo{letters_black}: %pvp_state%"

  equip-seconds:
    slot: 11
    material: IRON_SWORD
    name: "{letters}PvP {letters_black}▸ <gradient:{primary}:{secondary_light}>Tempo de equipar</gradient>"
    lore:
      - "{letters_black}Ajuste de PvP"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Segundos com a espada na mão"
      - " {letters}antes de vestir o kit."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Espera{letters_black}: %pvp_equip_seconds%"
      - "  {letters_black}· {info}{icon:book} {letters}Padrão{letters_black}: %pvp_equip_seconds_default%"
