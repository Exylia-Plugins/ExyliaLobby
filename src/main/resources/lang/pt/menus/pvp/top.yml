menu-version: 2
# O top de abates do PvP do lobby. Seu para reestilizar: novos padrões aguardam em /exylialib updates.

title: '{primary}&lABATES {letters_black}» {highlight}PvP do lobby {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Sem mais jogadores'
    lore:
      - "{letters_black}Vença uma luta para entrar."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: 'playerhead-%row_name%'
    name: "{letters}Posição {letters_black}▸ <gradient:{highlight}:{warning_light}>#%row_rank% %row_name%</gradient>"
    lore:
      - "{letters_black}Ranking · Abates"
      - ""
      - "{highlight}♦ Recorde"
      - "  {letters_black}· {success}{icon:kills} {letters}Abates{letters_black}: {success}%row_kills%"
      - "  {letters_black}· {error}{icon:deaths} {letters}Mortes{letters_black}: {error}%row_deaths%"
      - "  {letters_black}· {info}{icon:star} {letters}Razão{letters_black}: {info}%row_ratio%"
      - "  {letters_black}· {accent}{icon:heart} {letters}Melhor sequência{letters_black}: {accent}%row_best%"

  navigation:
    previous:
      slot: 48
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Próxima →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  summary:
    slot: 49
    material: 'playerhead-%player_name%'
    name: "{letters}PvP do lobby {letters_black}▸ <gradient:{primary}:{secondary_light}>Seu recorde</gradient>"
    lore:
      - "{letters_black}Suas lutas"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {highlight}{icon:star} {letters}Posição{letters_black}: {highlight}%my_rank%"
      - "  {letters_black}· {success}{icon:kills} {letters}Abates{letters_black}: {success}%my_kills%"
      - "  {letters_black}· {error}{icon:deaths} {letters}Mortes{letters_black}: {error}%my_deaths%"
      - "  {letters_black}· {accent}{icon:heart} {letters}Sequência{letters_black}: {accent}%my_streak%"
      - "  {letters_black}· {accent}{icon:star} {letters}Melhor sequência{letters_black}: {accent}%my_best%"
