        - 'next_page'

items:
  summary:
    slot: 49
    material: 'playerhead-%player_name%'
    name: "{letters}PvP лобби {letters_black}▸ <gradient:{primary}:{secondary_light}>Ваш рекорд</gradient>"
    lore:
      - "{letters_black}Ваши бои"
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {highlight}{icon:star} {letters}Место{letters_black}: {highlight}%my_rank%"
      - "  {letters_black}· {success}{icon:kills} {letters}Убийства{letters_black}: {success}%my_kills%"
      - "  {letters_black}· {error}{icon:deaths} {letters}Смерти{letters_black}: {error}%my_deaths%"
