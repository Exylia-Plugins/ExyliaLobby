menu-version: 1
# НЕ РЕДАКТИРОВАТЬ — ПЕРЕСОЗДАЁТСЯ ПРИ КАЖДОМ ЗАПУСКЕ.
#
# Все модули ExyliaLobby: включайте на лету или открывайте их настройки.

title: '{primary}&lЛОББИ {letters_black}» {highlight}Модули {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Больше нет модулей'
    lore:
      - "{letters_black}Здесь все модули."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: '%module_icon%'
    glow: '%module_glow%'
    name: "{letters}Модуль {letters_black}▸ <gradient:{primary}:{secondary_light}>%module_name%</gradient>"
    lore:
      - "{letters_black}Модуль лобби"
      - ""
      - "{primary}✎ Информация"
      - "%module_description%"
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:redstone} {letters}Состояние{letters_black}: %module_state%"
      - ""
      - "{primary}{icon:click} ЛКМ {letters_black}· {letters}вкл/выкл"
      - "{letters_black}Применяется сразу, без рестарта."
      - "{primary}{icon:right_click} ПКМ {letters_black}· {letters}открыть"
      - "{letters_black}Его экран или настройки."
    actions:
      - 'left: exylialobby:module_toggle %module_id%'
      - 'right: exylialobby:module_open %module_id%'

