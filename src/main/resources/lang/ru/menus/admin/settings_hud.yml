# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The hud settings an admin tunes. Everything else is in
# modules/hud/config.yml.

title: "{primary}&lНАСТРОЙКИ {letters_black}» {highlight}HUD"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: NAME_TAG
    name: "<gradient:{primary}:{secondary_light}>HUD</gradient>"
    lore:
      - "{letters_black}Настройки: HUD"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Что игроки видят на экране"
      - " {letters}в лобби."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:redstone} {letters}Модуль{letters_black}: %hud_state%"

  sidebar-enabled:
    slot: 11
    material: OAK_SIGN
    name: "{letters}HUD {letters_black}▸ <gradient:{primary}:{secondary_light}>Боковая панель</gradient>"
    lore:
      - "{letters_black}Настройка: HUD"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Показывает боковую панель в лобби."
