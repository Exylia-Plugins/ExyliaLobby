  header:
    slot: 4
    material: RESPAWN_ANCHOR
    name: "<gradient:{primary}:{secondary_light}>Спавн</gradient>"
    lore:
      - "{letters_black}Настройки: Спавн"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Где появляются игроки и когда"
      - " {letters}их возвращают на спавн."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:redstone} {letters}Модуль{letters_black}: %spawn_state%"

  on-join:
    slot: 11
    material: OAK_DOOR
    name: "{letters}Спавн {letters_black}▸ <gradient:{primary}:{secondary_light}>При входе</gradient>"
    lore:
      - "{letters_black}Настройка: Спавн"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Кого отправляют на спавн при"
