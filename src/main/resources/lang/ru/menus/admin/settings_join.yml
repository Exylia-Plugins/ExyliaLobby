# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The join messages settings an admin tunes. Everything else is in
# modules/join/config.yml.

title: "{primary}&lНАСТРОЙКИ {letters_black}» {highlight}Сообщения о входе"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: OAK_SIGN
    name: "<gradient:{primary}:{secondary_light}>Сообщения о входе</gradient>"
    lore:
      - "{letters_black}Настройки: Вход"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Кто видит какие сообщения о"
      - " {letters}входе и выходе, и когда."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:redstone} {letters}Модуль{letters_black}: %join_state%"

  only-in-lobby:
    slot: 12
    material: COMPASS
    name: "{letters}Вход {letters_black}▸ <gradient:{primary}:{secondary_light}>Только в лобби</gradient>"
    lore:
      - "{letters_black}Настройка: Вход"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Обрабатывает только входящих и"
      - " {letters}выходящих в лобби."
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {info}{icon:redstone} {letters}Включено{letters_black}: %join_only_in_lobby%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %join_only_in_lobby_default%"
      - ""
      - "%join_only_in_lobby_click%"
    actions:
      - "exylialobby:setting join only-in-lobby"

  hide-vanilla-messages:
    slot: 13
    material: BARRIER
    name: "{letters}Вход {letters_black}▸ <gradient:{primary}:{secondary_light}>Скрыть ванильные</gradient>"
    lore:
      - "{letters_black}Настройка: Вход"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Скрывает ванильные строки входа"
      - " {letters}и выхода, если нет своих."
