menu-version: 1
# НЕ РЕДАКТИРОВАТЬ — ПЕРЕСОЗДАЁТСЯ ПРИ КАЖДОМ ЗАПУСКЕ.
#
# Общий список для админ-экранов модулей лобби: джамп-пады, NPC, порталы, голограммы.

title: '{primary}&lХАБ {letters_black}» {highlight}%list_title% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Больше нет записей'
    lore:
      - "{letters_black}Добавьте кнопками ниже."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: '%row_icon%'
    glow: '%row_glow%'
    name: "{letters}%list_kind% {letters_black}▸ <gradient:{primary}:{secondary_light}>%row_name%</gradient>"
    lore:
      - "{letters_black}%row_subtitle%"
      - ""
      - "{primary}✦ Статус"
      - "%row_stats%"
      - ""
      - "%row_clicks%"
    actions:
      - 'left: exylialobby:screen_row %screen_id% left %row_id%'
      - 'right: exylialobby:screen_row %screen_id% right %row_id%'
      - 'shift_left: exylialobby:screen_row %screen_id% turn %row_id%'
      - 'shift_right: exylialobby:screen_row %screen_id% shift %row_id%'

  navigation:
    previous:
      slot: 48
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Страница {letters_black}▸ <gradient:{error}:{error_light}>← Предыдущая</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Страница {letters_black}▸ <gradient:{success}:{success_light}>Следующая →</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  add1:
    slot: 45
    material: '%add1_icon%'
    name: "{letters}%list_kind% {letters_black}▸ <gradient:{success}:{success_light}>%add1_title%</gradient>"
    lore:
      - "{letters_black}%list_kind%"
      - ""
      - "{success}✎ Информация"
      - "%add1_text%"
      - ""
      - "{success}{icon:click} %add1_click%"
      - "{letters_black}%add1_next%"
    actions:
      - 'exylialobby:screen_add %screen_id% 0'

  add2:
    slot: 46
    material: '%add2_icon%'
    name: "{letters}%list_kind% {letters_black}▸ <gradient:{success}:{success_light}>%add2_title%</gradient>"
    lore:
      - "{letters_black}%list_kind%"
      - ""
      - "{success}✎ Информация"
      - "%add2_text%"
      - ""
      - "{success}{icon:click} %add2_click%"
      - "{letters_black}%add2_next%"
    actions:
      - 'exylialobby:screen_add %screen_id% 1'

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>%back_name%</gradient>"
    lore:
      - "{error}{icon:click} Нажмите, чтобы вернуться"
    actions:
      - 'exylialobby:screen_back %screen_id%'
