menu-version: 1
# Одна трасса паркура. # Можно менять стиль: новые значения по умолчанию ждут в /exylialib updates.

title: '{primary}&lПАРКУР {letters_black}» {highlight}%course_name%'
size: 27

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: FEATHER
    name: "{letters}Трасса {letters_black}▸ %course_name%"
    lore:
      - "{letters_black}Трасса"
      - ""
      - "{primary}✦ Статус"
      - "  {letters_black}· {warning}{icon:star} {letters}Сложность{letters_black}: {warning}%course_difficulty%"
      - "  {letters_black}· {info}{icon:clock} {letters}Лучшее{letters_black}: {info}%course_best%"
      - "  {letters_black}· {highlight}{icon:gold} {letters}Медаль{letters_black}: %course_medal%"
      - "  {letters_black}· {success}{icon:book} {letters}Финиши{letters_black}: {success}%course_finishes%"

  play:
    slot: 12
    material: LIME_DYE
    name: "{letters}Трасса {letters_black}▸ <gradient:{success}:{success_light}>Играть</gradient>"
    lore:
      - "{letters_black}Пройти трассу"
      - ""
      - "{success}✎ Информация"
      - " {letters}Побейте рекорд, чтобы подняться"
      - " {letters}в {highlight}таблице лидеров{letters}."
      - ""
      - "{success}{icon:click} Нажмите, чтобы играть"
      - "{letters_black}Вас отправит на старт."
    actions:
      - 'exylialobby:parkour_play %course_id%'

  splits:
    slot: 13
    material: CLOCK
    name: "{letters}Трасса {letters_black}▸ <gradient:{info}:{info_light}>Ваши сплиты</gradient>"
    lore:
      - "{letters_black}Ваш лучший забег"
      - ""
      - "{info}⌚ Чекпоинты"
      - "%course_splits%"

  top:
    slot: 14
    material: GOLD_INGOT
    name: "{letters}Трасса {letters_black}▸ <gradient:{highlight}:{warning_light}>Таблица лидеров</gradient>"
    lore:
      - "{letters_black}Рейтинги"
      - ""
      - "{highlight}✎ Информация"
      - " {letters}Лучшие забеги: за всё время,"
      - " {letters}месяц, неделю и день."
      - ""
      - "{highlight}{icon:click} Нажмите, чтобы открыть"
      - "{letters_black}Узнайте своё место."
    actions:
      - 'exylialobby:parkour_top %course_id%'

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>Трассы</gradient>"
    lore:
      - "{error}{icon:click} Нажмите, чтобы вернуться"
    actions:
      - 'exylialobby:parkour_list'

  reset:
    slot: 26
    material: TNT
    name: "{letters}Трасса {letters_black}▸ <gradient:{error}:{error_light}>Сбросить моё время</gradient>"
    lore:
      - "{letters_black}Опасная зона"
      - ""
      - "{error}✎ Информация"
      - " {letters}Стирает рекорд, сплиты и"
      - " {letters}места в топах этой трассы."
      - ""
      - "{error}{icon:click} Нажмите, чтобы сбросить"
      - "{letters_black}Вас попросят подтвердить."
    actions:
      - 'exylialobby:parkour_reset %course_id%'
