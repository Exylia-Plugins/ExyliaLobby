menu-version: 1
# Таблица лидеров паркура. # Можно менять стиль: новые значения по умолчанию ждут в /exylialib updates.

title: '{primary}&lТОП {letters_black}» {highlight}%board_title% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Больше нет забегов'
    lore:
      - "{letters_black}Финишируйте, чтобы попасть сюда."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: '%row_icon%'
    glow: '%row_glow%'
    name: "%row_name%"
    lore:
      - "%row_subtitle%"
      - ""
      - "%row_label_status%"
      - "%row_stats%"

  navigation:
    previous:
      slot: 48
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Страница {letters_black}▸ <gradient:{error}:{error_light}>← Предыдущая</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Страница {letters_black}▸ <gradient:{success}:{success_light}>Следующая →</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  period_all:
    slot: 45
    material: CLOCK
    glow: '%glow_all%'
    name: "{letters}Период {letters_black}▸ <gradient:{info}:{info_light}>За всё время</gradient>"
    lore:
      - "{letters_black}Фильтр"
      - ""
      - "{info}{icon:click} Нажмите, чтобы показать"
      - "{letters_black}Топ за всё время."
    actions:
      - 'exylialobby:parkour_period all'

  period_monthly:
    slot: 46
    material: CLOCK
    glow: '%glow_monthly%'
    name: "{letters}Период {letters_black}▸ <gradient:{info}:{info_light}>За месяц</gradient>"
    lore:
      - "{letters_black}Фильтр"
      - ""
      - "{info}{icon:click} Нажмите, чтобы показать"
      - "{letters_black}Топ за месяц."
    actions:
      - 'exylialobby:parkour_period monthly'

  period_weekly:
    slot: 47
    material: CLOCK
    glow: '%glow_weekly%'
    name: "{letters}Период {letters_black}▸ <gradient:{info}:{info_light}>За неделю</gradient>"
    lore:
      - "{letters_black}Фильтр"
      - ""
      - "{info}{icon:click} Нажмите, чтобы показать"
      - "{letters_black}Топ за неделю."
    actions:
      - 'exylialobby:parkour_period weekly'

  period_daily:
    slot: 51
    material: CLOCK
    glow: '%glow_daily%'
    name: "{letters}Период {letters_black}▸ <gradient:{info}:{info_light}>За день</gradient>"
    lore:
      - "{letters_black}Фильтр"
      - ""
      - "{info}{icon:click} Нажмите, чтобы показать"
      - "{letters_black}Топ за день."
    actions:
      - 'exylialobby:parkour_period daily'

  me:
    slot: 49
    material: 'playerhead-%player_name%'
    name: "{letters}Вы {letters_black}▸ <gradient:{highlight}:{warning_light}>%my_rank%</gradient>"
    lore:
      - "{letters_black}Ваше место · %period_name%"
      - ""
      - "{highlight}✦ Статус"
      - "  {letters_black}· {info}{icon:star} {letters}Лучшее{letters_black}: {info}%my_best%"
      - "  {letters_black}· {highlight}{icon:star} {letters}Место{letters_black}: {highlight}%my_rank%"

  back:
    slot: 53
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>%back_name%</gradient>"
    lore:
      - "{error}{icon:click} Нажмите, чтобы вернуться"
    actions:
      - 'exylialobby:parkour_top_back'
