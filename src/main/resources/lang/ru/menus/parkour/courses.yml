menu-version: 1
# Список трасс паркура. # Можно менять стиль: новые значения по умолчанию ждут в /exylialib updates.

title: '{primary}&lПАРКУР {letters_black}» {highlight}Трассы {muted}%current_page%/%total_pages%'
size: 36
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Больше нет трасс'
    lore:
      - "{letters_black}Админ добавляет их в /lobbyadmin."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: '%row_icon%'
    glow: '%row_glow%'
    name: "%row_name%"
    lore:
      - "%row_subtitle%"
      - ""
      - "%row_label_info%"
      - "%row_about%"
      - ""
      - "%row_label_status%"
      - "%row_stats%"
      - ""
      - "%row_clicks%"
    actions:
      - 'left: exylialobby:parkour_play %row_id%'
      - 'right: exylialobby:parkour_details %row_id%'

  navigation:
    previous:
      slot: 30
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Страница {letters_black}▸ <gradient:{error}:{error_light}>← Предыдущая</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 32
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Страница {letters_black}▸ <gradient:{success}:{success_light}>Следующая →</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  header:
    slot: 4
    material: FEATHER
    name: "<gradient:{info}:{info_light}>Паркур</gradient>"
    lore:
      - "{letters_black}Трассы и бесконечные режимы"
      - ""
      - "{info}✎ Информация"
      - " {letters}ЛКМ — играть. ПКМ —"
      - " {letters}детали и топ."
      - " {letters}Пройденные {success}светятся{letters}."

  summary:
    slot: 31
    material: GOLD_INGOT
    name: "{letters}Паркур {letters_black}▸ <gradient:{highlight}:{warning_light}>Ваш прогресс</gradient>"
    lore:
      - "{letters_black}Ваши трассы"
      - ""
      - "{highlight}✦ Статус"
      - "  {letters_black}· {success}{icon:book} {letters}Пройдено{letters_black}: {success}%done%{letters_black}/{info}%total%"
      - "  {letters_black}· {highlight}{icon:gold} {letters}Медали{letters_black}: {highlight}%medals%"
