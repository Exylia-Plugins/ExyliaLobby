# Одна запись на модуль: название и короткое описание (две-три строки по ~30 символов).
modules:
  spawn:
    name: Спавн
    description:
    - Точка спавна, /spawn, возврат
    - из бездны и возрождение.
  state:
    name: Состояние игрока
    description:
    - Режим игры, здоровье, голод,
    - эффекты, время и погода.
  protection:
    name: Защита
    description:
    - Без строительства, урона,
    - дропа, мобов, огня, взрывов.
  join:
    name: Вход и выход
    description:
    - Сообщения, приветствие и
    - команды при входе и выходе.
  hotbar:
    name: Хотбар
    description:
    - Предметы, что открывают меню,
    - шлют на серверы, ведут команды.
  movement:
    name: Движение
    description:
    - Двойной прыжок и
    - джамп-пады.
  triggers:
    name: 'Триггеры'
    description:
    - 'Кнопки, плиты и области,'
    - 'которые запускают действия.'
  visibility:
    name: Видимость
    description:
    - Игроки выбирают, кого
    - видят в лобби.
  selector:
    name: Выбор сервера
    description:
    - Серверы и лобби с онлайном,
    - порталы.
  games:
    name: Игры
    description:
    - Все игры плагинов Exylia
    - на одном экране.
  hud:
    name: HUD
    description:
    - 'Шапка и подвал списка игроков,'
    - 'и объявления.'
  pvp:
    name: PvP лобби
    description:
    - Меч в руке — бой с игроками,
    - что согласились на PvP.
  parkour:
    name: Паркур
    description:
    - Трассы, бесконечный паркур
    - и таблицы лидеров.
  gadgets:
    name: Гаджеты
    description:
    - Крюк-кошка, эндер-поездка,
    - краскомёт и не только.
  chat:
    name: Чат
    description:
    - Блокировка чата, медленный
    - режим и очистка.
  onboarding:
    name: Знакомство
    description:
    - Передаёт новичков
    - в ExyliaJourney.
