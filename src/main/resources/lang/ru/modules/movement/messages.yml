# Редактор падов: чат-сообщения. %pad% — id пада.
pad-added: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Джамп-пад {highlight}%pad%{letters} добавлен.'
pad-removed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Джамп-пад {highlight}%pad%{letters} удалён.'
pad-changed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Джамп-пад {highlight}%pad%{letters} обновлён.'
same-place: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}На этом блоке уже есть пад.'

# Запросы редактора падов.
prompt-power: '{letters}Горизонтальная скорость пада (от 0.1 до 8).'
prompt-vertical: '{letters}Скорость вверх у пада (от 0.1 до 4).'
confirm-remove: Удалить джамп-пад {highlight}%pad%{letters}?

# Редактор падов: тексты карточек.
list-title: Движение
list-kind: Джамп-пад
row-subtitle: Подбрасывает наступившего
label-place: Блок
label-power: Сила
label-vertical: Высота
label-direction: Направление
direction-look: '{info}Куда вы смотрите'

# Направление фиксированного пада. %yaw% — угол в градусах.
direction-fixed: '{info}Задано: %yaw%°'
clicks:
- '{primary}{icon:click} ЛКМ {letters_black}· {letters}изменить силу'
- '{primary}{icon:right_click} ПКМ {letters_black}· {letters}изменить высоту'
- '{primary}{icon:click} Shift+ЛКМ {letters_black}· {letters}задать или снять направление'
- '{error}{icon:right_click} Shift+ПКМ {letters_black}· {letters}убрать'
- '{letters_black}Удаление нужно подтвердить.'
add-pad-title: Джамп-пад
add-pad-text:
- ' {letters}Кликните по блоку, который станет'
- ' {letters}джамп-падом; он бросает игроков'
- ' {letters}туда, куда они смотрят.'
add-pad-click: Нажмите, чтобы начать
add-pad-next: Затем измените силу здесь.
add-aimed-title: Направленный джамп-пад
add-aimed-text:
- ' {letters}Встаньте на блок, повернитесь'
- ' {letters}туда, куда он будет бросать,'
- ' {highlight}Shift+клик{letters}.'
add-aimed-click: Нажмите, чтобы начать
add-aimed-next: Всегда бросает в эту сторону.
back-name: Движение

# Что мастера настройки называют на экране (простой текст, без цветов).
wizard-pad: Джамп-пад
wizard-aimed: Направленный джамп-пад
wizard-aim: Направление пада

# A pad throws from every block it lists (Q on its card edits them).
label-blocks: Блоки
click-blocks: '{primary}{icon:click} Q {letters_black}· {letters}добавить или убрать блоки'
wizard-blocks: Блоки платформы
block-added: '[sound:BLOCK_NOTE_BLOCK_PLING|0.6|1.6]%prefix% {letters}Блок добавлен в {highlight}%pad%{letters} ({highlight}%count%{letters}). Нажми на другой или отмени, чтобы закончить.'
block-removed: '[sound:BLOCK_NOTE_BLOCK_BASS|0.6|1.0]%prefix% {letters}Блок убран из {highlight}%pad%{letters} ({highlight}%count%{letters}). Нажми на другой или отмени, чтобы закончить.'
