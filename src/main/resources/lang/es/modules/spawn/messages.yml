# /spawn cuando no se encontró un punto de spawn
no-spawn: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}No hay spawn definido. Pide ayuda a un admin.'

# /spawn con espera. %time% es la espera.
teleporting: '%prefix% {letters}Teletransporte en {highlight}%time%{letters}. No te muevas.'
cancelled: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}Teletransporte cancelado.'

# Boss bar durante la espera de /spawn. %time% es el tiempo restante (2.4s).
warmup-bar: '{info}&lSPAWN {letters_black}» {letters}Quédate quieto {letters_black}({info}%time%{letters_black})'

# Un admin fijó el spawn de un mundo. %world% es su nombre.
spawn-set: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Spawn de {highlight}%world%{letters} fijado donde estabas.'

# Se muestra en la pantalla de Spawn: hay un spawn aquí, o no
state-set: '{success}{icon:on} Fijado'
state-unset: '{warning}{icon:warning} Sin fijar'

# Editor de áreas del lobby: tipos y estados de cada tarjeta
kind-world: Mundo del lobby
kind-box: Zona del lobby
state-label-world: Estado
state-label-box: Tamaño
world-loaded: '{success}{icon:on} Cargado'
world-missing: '{error}{icon:off} No cargado'

# Tamaño de una zona. %x%, %y% y %z% son sus lados en bloques.
box-size: '{info}%x%×%y%×%z% bloques'

# Lo que los asistentes nombran en pantalla (texto plano, sin colores): el spawn de un mundo, una caja del lobby
wizard-spawn: Spawn del lobby
wizard-box: Caja del lobby

# Mensajes del editor de áreas
prompt-name: '{letters}Nombra esta zona del lobby (letras, números, guiones).'
name-taken: '{error}Ese nombre ya está en uso.'
confirm-world: '¿Dejar de tratar el mundo {highlight}%area%{letters} como lobby?'
confirm-box: '¿Eliminar la zona del lobby {highlight}%area%{letters}?'
