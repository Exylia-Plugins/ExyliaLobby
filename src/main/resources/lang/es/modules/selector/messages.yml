# Líneas de chat. %server% es el nombre del servidor del catálogo (o su id).
connecting: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {letters}Conectando a %server%{letters}...'
offline: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}%server%{error} está fuera de línea ahora.'
no-permission: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}No puedes entrar a %server%{error}.'
here: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {warning}Ya estás en %server%{warning}.'
unreachable: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}No se pudo contactar con la red. Inténtalo en un momento.'
unknown-server: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}Ese servidor no está configurado.'

# Líneas de la tarjeta de un servidor. Los estados y el aviso de clic (dos líneas, unidas por <nl>).
status-online: '{success}En línea'
status-offline: '{error}Fuera de línea'
status-unknown: '{muted}Sin datos'
click-join: '{info}{icon:click} Clic para entrar<nl>{letters_black}Te movemos al instante.'
click-locked: '{warning}{icon:locked} Bloqueado<nl>{letters_black}Necesitas un rango para entrar.'
click-offline: '{error}{icon:off} Fuera de línea<nl>{letters_black}Inténtalo en un momento.'
click-here: '{success}{icon:on} Estás aquí<nl>{letters_black}Elige otro lobby para cambiar.'
no-lobbies: '{warning}{icon:warning} Sin lobbies<nl>{letters_black}Pide a un admin que los añada.'
lobbies-next: '{info}{icon:click} Clic para abrir<nl>{letters_black}Elige el lobby donde jugar.'

# Pantalla de admin
list-title: Selector
list-kind: Portal de servidor
subtitle-portal: Portal de servidor
label-server: Servidor
label-place: Lugar
label-size: Tamaño
server-missing: '{error}No está en el catálogo'
clicks-portal:
- '{primary}{icon:click} Clic izquierdo {letters_black}· {letters}cambiar servidor'
- '{primary}{icon:right_click} Clic derecho {letters_black}· {letters}ver su contorno'
- '{error}{icon:right_click} Shift + clic derecho {letters_black}· {letters}eliminar'
- '{letters_black}Eliminar pide confirmación.'
add-portal-title: Portal
add-portal-text:
- ' {letters}Selecciona una zona; entrar'
- ' {letters}en ella envía a los jugadores.'
add-portal-click: Clic para empezar
add-portal-next: Luego eliges su servidor.
prompt-server: '{letters}¿A qué servidor envía a los jugadores?'
no-servers: '[sound:ENTITY_VILLAGER_NO|0.7|1.0]%prefix% {error}Añade primero un servidor al catálogo (modules/selector/config.yml).'
added: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {highlight}%what%{letters} añadido.'
removed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {highlight}%what%{letters} eliminado.'
changed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|0.6|1.2]%prefix% {highlight}%what%{letters} ahora envía a los jugadores a %server%{letters}.'
confirm-remove: '¿Eliminar {highlight}%what%{letters}?'

# Lo que los asistentes nombran en pantalla (texto plano, sin colores).
wizard-portal: Portal
