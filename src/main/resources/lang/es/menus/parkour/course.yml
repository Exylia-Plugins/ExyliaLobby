menu-version: 1
# Un recorrido de parkour. # Es tuyo para rediseñar: los nuevos valores esperan en /exylialib updates.

title: '{primary}&lPARKOUR {letters_black}» {highlight}%course_name%'
size: 27

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: FEATHER
    name: "{letters}Recorrido {letters_black}▸ %course_name%"
    lore:
      - "{letters_black}Recorrido"
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {warning}{icon:star} {letters}Dificultad{letters_black}: {warning}%course_difficulty%"
      - "  {letters_black}· {info}{icon:clock} {letters}Mejor{letters_black}: {info}%course_best%"
      - "  {letters_black}· {highlight}{icon:gold} {letters}Medalla{letters_black}: %course_medal%"
      - "  {letters_black}· {success}{icon:book} {letters}Metas{letters_black}: {success}%course_finishes%"

  play:
    slot: 12
    material: LIME_DYE
    name: "{letters}Recorrido {letters_black}▸ <gradient:{success}:{success_light}>Jugar</gradient>"
    lore:
      - "{letters_black}Juégalo"
      - ""
      - "{success}✎ Información"
      - " {letters}Supera tu mejor marca para subir"
      - " {letters}el {highlight}ranking{letters}."
      - ""
      - "{success}{icon:click} Clic para jugar"
      - "{letters_black}Vas al inicio."
    actions:
      - 'exylialobby:parkour_play %course_id%'

  splits:
    slot: 13
    material: CLOCK
    name: "{letters}Recorrido {letters_black}▸ <gradient:{info}:{info_light}>Tus parciales</gradient>"
    lore:
      - "{letters_black}Tu mejor carrera"
      - ""
      - "{info}⌚ Checkpoints"
      - "%course_splits%"

  top:
    slot: 14
    material: GOLD_INGOT
    name: "{letters}Recorrido {letters_black}▸ <gradient:{highlight}:{warning_light}>Ranking</gradient>"
    lore:
      - "{letters_black}Rankings"
      - ""
      - "{highlight}✎ Información"
      - " {letters}Las carreras más rápidas, de"
      - " {letters}mensual, semanal y diario."
      - ""
      - "{highlight}{icon:click} Clic para abrir"
      - "{letters_black}Mira en qué puesto estás."
    actions:
      - 'exylialobby:parkour_top %course_id%'

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Volver {letters_black}▸ <gradient:{error}:{error_light}>Recorridos</gradient>"
    lore:
      - "{error}{icon:click} Clic para volver"
    actions:
      - 'exylialobby:parkour_list'

  reset:
    slot: 26
    material: TNT
    name: "{letters}Recorrido {letters_black}▸ <gradient:{error}:{error_light}>Reiniciar mi tiempo</gradient>"
    lore:
      - "{letters_black}Zona de peligro"
      - ""
      - "{error}✎ Información"
      - " {letters}Borra tu mejor marca, parciales y"
      - " {letters}puestos en sus rankings."
      - ""
      - "{error}{icon:click} Clic para reiniciar"
      - "{letters_black}Se te pedirá confirmar."
    actions:
      - 'exylialobby:parkour_reset %course_id%'
