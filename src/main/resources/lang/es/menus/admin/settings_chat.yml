# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The chat settings an admin tunes. Everything else is in
# modules/chat/config.yml.

title: "{primary}&lAJUSTES {letters_black}» {highlight}Chat"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: WRITABLE_BOOK
    name: "<gradient:{primary}:{secondary_light}>Chat</gradient>"
    lore:
      - "{letters_black}Ajustes de Chat"
      - ""
      - "{primary}✎ Información"
      - " {letters}Control del chat en el lobby:"
      - " {letters}bloqueo, modo lento y limpieza."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Módulo{letters_black}: %chat_state%"

  locked-at-start:
    slot: 12
    material: IRON_DOOR
    name: "{letters}Chat {letters_black}▸ <gradient:{primary}:{secondary_light}>Bloqueado al iniciar</gradient>"
    lore:
      - "{letters_black}Ajuste de Chat"
      - ""
      - "{primary}✎ Información"
      - " {letters}Inicia con el chat bloqueado. Un"
      - " {letters}reinicio vuelve a este valor."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Activado{letters_black}: %chat_locked_at_start%"
      - "  {letters_black}· {info}{icon:book} {letters}Predeterminado{letters_black}: %chat_locked_at_start_default%"
      - ""
      - "%chat_locked_at_start_click%"
    actions:
      - "exylialobby:setting chat locked-at-start"

  slow-mode-seconds:
    slot: 13
    material: COBWEB
    name: "{letters}Chat {letters_black}▸ <gradient:{primary}:{secondary_light}>Modo lento</gradient>"
    lore:
      - "{letters_black}Ajuste de Chat"
      - ""
      - "{primary}✎ Información"
      - " {letters}Segundos entre dos mensajes de"
      - " {letters}un jugador. {highlight}0 {letters}es apagado."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:clock} {letters}Retraso{letters_black}: %chat_slow_mode_seconds%"
      - "  {letters_black}· {info}{icon:book} {letters}Predeterminado{letters_black}: %chat_slow_mode_seconds_default%"
      - ""
      - "%chat_slow_mode_seconds_click%"
    actions:
      - "exylialobby:setting chat slow-mode-seconds"

  clear-lines:
    slot: 14
    material: PAPER
    name: "{letters}Chat {letters_black}▸ <gradient:{primary}:{secondary_light}>Líneas de limpieza</gradient>"
    lore:
      - "{letters_black}Ajuste de Chat"
      - ""
      - "{primary}✎ Información"
      - " {letters}Cuántas líneas en blanco envía"
      - " {letters}el comando de limpiar chat."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:book} {letters}Líneas{letters_black}: %chat_clear_lines%"
      - "  {letters_black}· {info}{icon:book} {letters}Predeterminado{letters_black}: %chat_clear_lines_default%"
      - ""
      - "%chat_clear_lines_click%"
    actions:
      - "exylialobby:setting chat clear-lines"

