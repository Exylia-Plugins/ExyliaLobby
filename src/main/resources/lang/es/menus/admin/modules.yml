menu-version: 1
# NO EDITAR — SE REGENERA EN CADA INICIO.
#
# Cada módulo de ExyliaLobby: actívalo en vivo o abre sus ajustes.

title: '{primary}&lLOBBY {letters_black}» {highlight}Módulos {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}No hay más módulos'
    lore:
      - "{letters_black}Aquí se listan todos los módulos."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: '%module_icon%'
    glow: '%module_glow%'
    name: "{letters}Módulo {letters_black}▸ <gradient:{primary}:{secondary_light}>%module_name%</gradient>"
    lore:
      - "{letters_black}Módulo del lobby"
      - ""
      - "{primary}✎ Información"
      - "%module_description%"
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:redstone} {letters}Estado{letters_black}: %module_state%"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}activar o desactivar"
      - "{letters_black}Se aplica al instante."
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}abrir"
      - "{letters_black}Su pantalla o sus ajustes."
    actions:
      - 'left: exylialobby:module_toggle %module_id%'
      - 'right: exylialobby:module_open %module_id%'

  navigation:
