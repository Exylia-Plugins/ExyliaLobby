menu-version: 1
# NO EDITAR — SE REGENERA EN CADA INICIO.
#
# Las áreas del lobby: los mundos y zonas donde rigen las reglas del lobby.

title: '{primary}&lÁREAS {letters_black}» {highlight}Lobby {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}No hay más áreas'
    lore:
      - "{letters_black}Añade un mundo o marca una zona."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: '%area_icon%'
    name: "{letters}Área {letters_black}▸ <gradient:{primary}:{secondary_light}>%area_name%</gradient>"
    lore:
      - "{letters_black}%area_kind_label%"
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:map} {letters}Mundo{letters_black}: {info}%area_world%"
      - "  {letters_black}· {info}{icon:redstone} {letters}%area_state_label%{letters_black}: %area_state%"
      - ""
      - "{error}{icon:right_click} Clic derecho {letters_black}· {letters}quitar"
      - "{letters_black}Se te pedirá confirmar."
    actions:
      - 'right: exylialobby:spawn_area_remove %area_kind% %area_id%'

  navigation:
    previous:
      slot: 48
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Siguiente →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  add_box:
    slot: 45
    material: GOLDEN_AXE
    name: "{letters}Área {letters_black}▸ <gradient:{success}:{success_light}>Añadir zona</gradient>"
    lore:
      - "{letters_black}Área del lobby"
      - ""
      - "{success}✎ Información"
      - " {letters}Marca dos esquinas con el"
      - " {letters}hacha dorada; las reglas"
      - " {letters}rigen dentro de esa zona."
      - ""
      - "{success}{icon:click} Clic para seleccionar"
      - "{letters_black}Luego nombras la zona."
    actions:
      - 'exylialobby:spawn_area_add_box'

  add_world:
    slot: 46
    material: GRASS_BLOCK
    name: "{letters}Área {letters_black}▸ <gradient:{success}:{success_light}>Añadir este mundo</gradient>"
    lore:
      - "{letters_black}Área del lobby"
      - ""
      - "{success}✎ Información"
      - " {letters}Todo el mundo donde estás"
      - " {letters}pasa a ser {highlight}lobby{letters}."
      - ""
      - "{success}{icon:click} Clic para añadir"
      - "{letters_black}Se aplica al instante."
    actions:
      - 'exylialobby:spawn_area_add_world'

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Volver {letters_black}▸ <gradient:{error}:{error_light}>%back_name%</gradient>"
    lore:
      - "{error}{icon:click} Clic para volver"
    actions:
      - 'exylialobby:spawn_areas_back'
