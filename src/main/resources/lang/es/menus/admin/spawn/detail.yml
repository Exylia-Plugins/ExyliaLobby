menu-version: 2
# NO EDITAR — SE REGENERA EN CADA INICIO.
#
# El módulo de spawn: fija el punto de spawn, pruébalo y edita las áreas del lobby.

title: '{primary}&lSPAWN {letters_black}» {highlight}Configuración'
size: 27

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: RED_BED
    name: "<gradient:{primary}:{secondary_light}>Spawn</gradient>"
    lore:
      - "{letters_black}Módulo de spawn"
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:map} {letters}Mundo{letters_black}: {info}%spawn_world%"
      - "  {letters_black}· {info}{icon:compass} {letters}Spawn aquí{letters_black}: %spawn_state%"

  set:
    slot: 12
    material: LIME_BED
    name: "{letters}Spawn {letters_black}▸ <gradient:{success}:{success_light}>Fijar spawn</gradient>"
    lore:
      - "{letters_black}Punto de spawn"
      - ""
      - "{success}✎ Información"
