      - " {letters}del lobby rigen."
      - ""
      - "{primary}{icon:click} Clic para abrir"
      - "{letters_black}Añade un mundo o marca una zona."
    actions:
      - 'exylialobby:spawn_areas'

  teleport:
    slot: 18
    material: ENDER_PEARL
    name: "{letters}Spawn {letters_black}▸ <gradient:{info}:{info_light}>Teletransporte</gradient>"
    lore:
