menu-version: 2
# El top de bajas del PvP del lobby. Es tuyo para rediseñar: los nuevos valores esperan en /exylialib updates.

title: '{primary}&lBAJAS {letters_black}» {highlight}PvP del lobby {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}No hay más jugadores'
    lore:
      - "{letters_black}Gana una pelea para entrar."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: 'playerhead-%row_name%'
    name: "{letters}Puesto {letters_black}▸ <gradient:{highlight}:{warning_light}>#%row_rank% %row_name%</gradient>"
    lore:
      - "{letters_black}Ranking · Bajas"
      - ""
      - "{highlight}♦ Récord"
      - "  {letters_black}· {success}{icon:kills} {letters}Bajas{letters_black}: {success}%row_kills%"
      - "  {letters_black}· {error}{icon:deaths} {letters}Muertes{letters_black}: {error}%row_deaths%"
      - "  {letters_black}· {info}{icon:star} {letters}Ratio{letters_black}: {info}%row_ratio%"
      - "  {letters_black}· {accent}{icon:heart} {letters}Mejor racha{letters_black}: {accent}%row_best%"

  navigation:
    previous:
      slot: 48
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
