    slot: 49
    material: 'playerhead-%player_name%'
    name: "{letters}PvP del lobby {letters_black}▸ <gradient:{primary}:{secondary_light}>Tu récord</gradient>"
    lore:
      - "{letters_black}Tus peleas"
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {highlight}{icon:star} {letters}Puesto{letters_black}: {highlight}%my_rank%"
      - "  {letters_black}· {success}{icon:kills} {letters}Bajas{letters_black}: {success}%my_kills%"
      - "  {letters_black}· {error}{icon:deaths} {letters}Muertes{letters_black}: {error}%my_deaths%"
