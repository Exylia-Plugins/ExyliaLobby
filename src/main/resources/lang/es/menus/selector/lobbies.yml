menu-version: 1
# La pantalla del selector de lobbies. Es tuya para rediseñar: los nuevos valores esperan en /exylialib updates.

title: '{primary}&lLOBBIES {letters_black}» {highlight}Red {muted}%current_page%/%total_pages%'
size: 36
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}No hay más lobbies'
    lore:
      - "{letters_black}Pide a un admin que los añada."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: '%row_icon%'
    glow: '%row_glow%'
    name: "{letters}Lobby {letters_black}▸ <gradient:{info}:{info_light}>%row_name%</gradient>"
    lore:
      - "{letters_black}Lobby · %row_state%"
      - ""
      - "{info}✦ Estado"
      - "  {letters_black}· {letters}Jugadores{letters_black}: {info}%row_players%"
      - ""
      - "%row_prompt%"
    actions:
      - 'exylialobby:selector_join %row_ref%'

  navigation:
    previous:
      slot: 30
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 32
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Siguiente →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  header:
    slot: 4
    material: ENDER_PEARL
    name: "<gradient:{info}:{info_light}>Lobbies</gradient>"
    lore:
      - "{letters_black}Selector de lobbies"
      - ""
      - "{info}✎ Información"
      - " {letters}Primero los más vacíos."
      - " {letters}El que usas brilla."
      - ""
      - "{info}✦ Estado"
      - "  {letters_black}· {letters}Lobbies{letters_black}: {info}%lobby_count%"
