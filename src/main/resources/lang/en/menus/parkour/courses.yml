menu-version: 1
# The parkour course list. # Yours to restyle: new defaults wait in /exylialib updates.

title: '{primary}&lPARKOUR {letters_black}» {highlight}Courses {muted}%current_page%/%total_pages%'
size: 36
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}No more courses'
    lore:
      - "{letters_black}An admin adds them with /lobbyadmin."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: '%row_icon%'
    glow: '%row_glow%'
    name: "%row_name%"
    lore:
      - "%row_subtitle%"
      - ""
      - "%row_label_info%"
      - "%row_about%"
      - ""
      - "%row_label_status%"
      - "%row_stats%"
      - ""
      - "%row_clicks%"
    actions:
      - 'left: exylialobby:parkour_play %row_id%'
      - 'right: exylialobby:parkour_details %row_id%'

  navigation:
    previous:
      slot: 30
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Previous</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 32
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Next →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  header:
    slot: 4
    material: FEATHER
    name: "<gradient:{info}:{info_light}>Parkour</gradient>"
    lore:
      - "{letters_black}Courses and endless modes"
      - ""
      - "{info}✎ Information"
      - " {letters}Left-click plays. Right-click"
      - " {letters}opens details and the top."
      - " {letters}Finished ones {success}glow{letters}."

  summary:
    slot: 31
    material: GOLD_INGOT
    name: "{letters}Parkour {letters_black}▸ <gradient:{highlight}:{warning_light}>Your progress</gradient>"
    lore:
      - "{letters_black}Your courses"
      - ""
      - "{highlight}✦ Status"
      - "  {letters_black}· {success}{icon:book} {letters}Finished{letters_black}: {success}%done%{letters_black}/{info}%total%"
      - "  {letters_black}· {highlight}{icon:gold} {letters}Medals{letters_black}: {highlight}%medals%"
