items:
  add_box:
    slot: 45
    material: GOLDEN_AXE
    name: "{letters}Area {letters_black}▸ <gradient:{success}:{success_light}>Add box</gradient>"
    lore:
      - "{letters_black}Lobby area"
      - ""
      - "{success}✎ Information"
      - " {letters}Select two corners with the"
      - " {letters}selector; the lobby rules"
      - " {letters}apply inside that box."
      - ""
      - "{success}{icon:click} Click to start"
      - "{letters_black}You select it, then name it."
    actions:
      - 'exylialobby:spawn_area_add_box'

  add_world:
    slot: 46
    material: GRASS_BLOCK
    name: "{letters}Area {letters_black}▸ <gradient:{success}:{success_light}>Add this world</gradient>"
    lore:
      - "{letters_black}Lobby area"
      - ""
      - "{success}✎ Information"
      - " {letters}The whole world you stand in"
      - " {letters}becomes {highlight}lobby{letters}."
      - ""
      - "{success}{icon:click} Click to add"
      - "{letters_black}Applies at once, no restart."
