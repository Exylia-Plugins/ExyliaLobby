      - "  {letters_black}· {info}{icon:map} {letters}World{letters_black}: {info}%area_world%"
      - "  {letters_black}· {info}{icon:redstone} {letters}%area_state_label%{letters_black}: %area_state%"
      - ""
      - "{error}{icon:right_click} Right-click {letters_black}· {letters}remove"
      - "{letters_black}You will be asked to confirm."
    actions:
      - 'right: exylialobby:spawn_area_remove %area_kind% %area_id%'

  navigation:
