# The lobby areas: the worlds and boxes where the lobby rules apply.

title: '{primary}&lAREAS {letters_black}» {highlight}Lobby {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}No more areas'
