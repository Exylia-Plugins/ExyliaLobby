# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The lobby pvp settings an admin tunes. Everything else is in
# modules/pvp/config.yml.

title: "{primary}&lSETTINGS {letters_black}» {highlight}Lobby PvP"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: DIAMOND_SWORD
    name: "<gradient:{primary}:{secondary_light}>Lobby PvP</gradient>"
    lore:
      - "{letters_black}PvP settings"
      - ""
      - "{primary}✎ Information"
      - " {letters}How the lobby PvP plays:"
      - " {letters}equip time and combat tag."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Module{letters_black}: %pvp_state%"

  equip-seconds:
    slot: 11
    material: IRON_SWORD
    name: "{letters}PvP {letters_black}▸ <gradient:{primary}:{secondary_light}>Equip time</gradient>"
    lore:
      - "{letters_black}PvP setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Seconds holding the sword before"
      - " {letters}the kit goes on."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Wait{letters_black}: %pvp_equip_seconds%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %pvp_equip_seconds_default%"
      - ""
      - "%pvp_equip_seconds_click%"
    actions:
      - "exylialobby:setting pvp equip-seconds"

  unequip-seconds:
    slot: 12
    material: LEATHER_CHESTPLATE
    name: "{letters}PvP {letters_black}▸ <gradient:{primary}:{secondary_light}>Unequip time</gradient>"
    lore:
      - "{letters_black}PvP setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Seconds off the sword before"
      - " {letters}the kit comes off."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Wait{letters_black}: %pvp_unequip_seconds%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %pvp_unequip_seconds_default%"
      - ""
      - "%pvp_unequip_seconds_click%"
    actions:
      - "exylialobby:setting pvp unequip-seconds"

  tag-seconds:
    slot: 14
    material: BLAZE_POWDER
    name: "{letters}PvP {letters_black}▸ <gradient:{primary}:{secondary_light}>Combat tag</gradient>"
    lore:
      - "{letters_black}PvP setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Seconds in combat after a hit,"
      - " {letters}given or taken."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Tag{letters_black}: %pvp_tag_seconds%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %pvp_tag_seconds_default%"
      - ""
      - "%pvp_tag_seconds_click%"
    actions:
      - "exylialobby:setting pvp tag-seconds"

  quit-counts:
    slot: 15
    material: SKELETON_SKULL
    name: "{letters}PvP {letters_black}▸ <gradient:{primary}:{secondary_light}>Quitting counts</gradient>"
    lore:
      - "{letters_black}PvP setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Quitting in combat counts as a"
      - " {letters}death for the quitter."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Enabled{letters_black}: %pvp_quit_counts%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %pvp_quit_counts_default%"
