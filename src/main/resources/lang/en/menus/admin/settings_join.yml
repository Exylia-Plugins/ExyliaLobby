# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The join messages settings an admin tunes. Everything else is in
# modules/join/config.yml.

title: "{primary}&lSETTINGS {letters_black}» {highlight}Join messages"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: OAK_SIGN
    name: "<gradient:{primary}:{secondary_light}>Join messages</gradient>"
    lore:
      - "{letters_black}Join settings"
      - ""
      - "{primary}✎ Information"
      - " {letters}Who sees which join and leave"
      - " {letters}message, and when."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Module{letters_black}: %join_state%"

  only-in-lobby:
    slot: 12
    material: COMPASS
    name: "{letters}Join {letters_black}▸ <gradient:{primary}:{secondary_light}>Only in lobby</gradient>"
    lore:
      - "{letters_black}Join setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Only handle players who join or"
      - " {letters}quit while in the lobby."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Enabled{letters_black}: %join_only_in_lobby%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %join_only_in_lobby_default%"
      - ""
      - "%join_only_in_lobby_click%"
