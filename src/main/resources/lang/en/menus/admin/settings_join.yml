      - " {letters}Hide the vanilla join and quit"
      - " {letters}lines when none applies."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Enabled{letters_black}: %join_hide_vanilla_messages%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %join_hide_vanilla_messages_default%"
      - ""
      - "%join_hide_vanilla_messages_click%"
    actions:
      - "exylialobby:setting join hide-vanilla-messages"

  welcome-delay:
    slot: 14
    material: CLOCK
    name: "{letters}Join {letters_black}▸ <gradient:{primary}:{secondary_light}>Welcome delay</gradient>"
    lore:
      - "{letters_black}Join setting"
      - ""
