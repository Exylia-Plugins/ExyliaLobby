# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The chat settings an admin tunes. Everything else is in
# modules/chat/config.yml.

title: "{primary}&lSETTINGS {letters_black}» {highlight}Chat"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: WRITABLE_BOOK
    name: "<gradient:{primary}:{secondary_light}>Chat</gradient>"
    lore:
      - "{letters_black}Chat settings"
      - ""
      - "{primary}✎ Information"
      - " {letters}Chat control inside the lobby:"
      - " {letters}lock, slow mode and clearing."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Module{letters_black}: %chat_state%"

  locked-at-start:
    slot: 12
    material: IRON_DOOR
    name: "{letters}Chat {letters_black}▸ <gradient:{primary}:{secondary_light}>Locked at start</gradient>"
    lore:
      - "{letters_black}Chat setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Start with the chat locked. A"
      - " {letters}restart goes back to this."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Enabled{letters_black}: %chat_locked_at_start%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %chat_locked_at_start_default%"
      - ""
      - "%chat_locked_at_start_click%"
    actions:
      - "exylialobby:setting chat locked-at-start"

  slow-mode-seconds:
    slot: 13
    material: COBWEB
    name: "{letters}Chat {letters_black}▸ <gradient:{primary}:{secondary_light}>Slow mode</gradient>"
    lore:
      - "{letters_black}Chat setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Seconds between two messages of"
      - " {letters}a player. {highlight}0 {letters}is off."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Delay{letters_black}: %chat_slow_mode_seconds%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %chat_slow_mode_seconds_default%"
      - ""
      - "%chat_slow_mode_seconds_click%"
    actions:
      - "exylialobby:setting chat slow-mode-seconds"

  clear-lines:
    slot: 14
    material: PAPER
    name: "{letters}Chat {letters_black}▸ <gradient:{primary}:{secondary_light}>Clear lines</gradient>"
    lore:
      - "{letters_black}Chat setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}How many blank lines the clear"
      - " {letters}chat command sends."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Lines{letters_black}: %chat_clear_lines%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %chat_clear_lines_default%"
      - ""
      - "%chat_clear_lines_click%"
    actions:
      - "exylialobby:setting chat clear-lines"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>Settings</gradient>"
    lore:
      - "{error}{icon:click} Click to go back"
    actions:
      - "exylialobby:settings_hub"
