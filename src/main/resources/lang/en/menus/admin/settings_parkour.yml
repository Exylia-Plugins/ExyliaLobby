# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The parkour settings an admin tunes. Everything else is in
# modules/parkour/config.yml.

title: "{primary}&lSETTINGS {letters_black}» {highlight}Parkour"
