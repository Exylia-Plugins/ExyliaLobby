menu-version: 1
# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# One parkour course: where it starts, passes and ends, and how it is judged.

title: '{primary}&lPARKOUR {letters_black}» {highlight}%course_id%'
size: 36

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: FEATHER
    name: "{letters}Course {letters_black}▸ <gradient:{primary}:{secondary_light}>%course_name%</gradient>"
    lore:
      - "{letters_black}Course"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:check} {letters}State{letters_black}: %course_state%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Enabled{letters_black}: %enabled%"

  start:
    slot: 11
    material: LIME_BED
    name: "{letters}Course {letters_black}▸ <gradient:{success}:{success_light}>Start</gradient>"
    lore:
      - "{letters_black}Course setting"
      - ""
      - "{success}✎ Information"
      - " {letters}Where a run begins. Uses your"
      - " {letters}position and view."
      - ""
      - "{success}✦ Status"
      - "  {letters_black}· {info}{icon:compass} {letters}Start{letters_black}: %start_state%"
      - ""
      - "{success}{icon:click} Click to set here"
      - "{letters_black}Replaces the start."
    actions:
      - 'exylialobby:parkour_edit start %course_id%'

  checkpoint:
    slot: 12
    material: LIGHT_WEIGHTED_PRESSURE_PLATE
    name: "{letters}Course {letters_black}▸ <gradient:{success}:{success_light}>Add checkpoint</gradient>"
    lore:
      - "{letters_black}Course setting"
      - ""
      - "{success}✎ Information"
      - " {letters}Adds a checkpoint at your feet."
      - " {letters}Runners reach them in order."
      - ""
      - "{success}✦ Status"
      - "  {letters_black}· {info}{icon:check} {letters}Checkpoints{letters_black}: {info}%checkpoints%"
      - ""
      - "{success}{icon:click} Click to add here"
      - "{letters_black}Added after the last one."
    actions:
      - 'exylialobby:parkour_edit checkpoint %course_id%'

  finish:
    slot: 14
    material: WHITE_BANNER
    name: "{letters}Course {letters_black}▸ <gradient:{success}:{success_light}>Finish</gradient>"
    lore:
      - "{letters_black}Course setting"
      - ""
      - "{success}✎ Information"
      - " {letters}Where a run ends. Uses your"
      - " {letters}position and view."
      - ""
      - "{success}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Finish{letters_black}: %finish_state%"
      - ""
      - "{success}{icon:click} Click to set here"
      - "{letters_black}Replaces the finish."
    actions:
      - 'exylialobby:parkour_edit finish %course_id%'

  kill:
    slot: 15
    material: MAGMA_BLOCK
    name: "{letters}Course {letters_black}▸ <gradient:{primary}:{secondary_light}>Kill blocks</gradient>"
    lore:
      - "{letters_black}Course setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}The block you look at sends"
      - " {letters}runners to their checkpoint."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:barrier} {letters}Blocks{letters_black}: {info}%kills%"
      - ""
      - "{primary}{icon:click} Click to add block"
      - "{letters_black}Look at a block first."
    actions:
      - 'exylialobby:parkour_edit kill %course_id%'

  medals:
    slot: 20
    material: GOLD_INGOT
    name: "{letters}Course {letters_black}▸ <gradient:{primary}:{secondary_light}>Medals</gradient>"
    lore:
      - "{letters_black}Course setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Target times in seconds for"
      - " {letters}gold, silver and bronze."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:gold} {letters}Targets{letters_black}: {info}%medals%"
      - ""
      - "{primary}{icon:click} Click to edit"
      - "{letters_black}Asks three numbers."
    actions:
      - 'exylialobby:parkour_edit medals %course_id%'

  difficulty:
    slot: 21
    material: NETHER_STAR
    name: "{letters}Course {letters_black}▸ <gradient:{primary}:{secondary_light}>Difficulty</gradient>"
    lore:
      - "{letters_black}Course setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}The label shown on its card."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:crit} {letters}Difficulty{letters_black}: {info}%difficulty%"
      - ""
      - "{primary}{icon:click} Click to edit"
      - "{letters_black}Free text, such as Hard."
    actions:
      - 'exylialobby:parkour_edit difficulty %course_id%'

  rewards:
    slot: 23
    material: CHEST
    name: "{letters}Course {letters_black}▸ <gradient:{primary}:{secondary_light}>Rewards</gradient>"
    lore:
      - "{letters_black}Course setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}First-finish and repeat rewards,"
      - " {letters}minimum time and limits."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Edited in the courses file"
      - ""
      - "{primary}{icon:click} Click to open"
      - "{letters_black}Pick this course there."
    actions:
      - 'exylialobby:parkour_edit rewards %course_id%'

  enabled:
    slot: 24
    material: LEVER
    name: "{letters}Course {letters_black}▸ <gradient:{primary}:{secondary_light}>Enabled</gradient>"
    lore:
      - "{letters_black}Course setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Players cannot start it while off."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Enabled{letters_black}: %enabled%"
      - ""
      - "{primary}{icon:click} Click to turn on or off"
      - "{letters_black}Changes at once."
    actions:
      - 'exylialobby:parkour_edit enabled %course_id%'

  board:
    slot: 27
    material: OAK_SIGN
    name: "{letters}Course {letters_black}▸ <gradient:{info}:{info_light}>Board here</gradient>"
    lore:
      - "{letters_black}Hologram"
      - ""
      - "{info}✎ Information"
      - " {letters}A leaderboard hologram of"
      - " {letters}this course at your feet."
      - ""
      - "{info}{icon:click} Click to place"
      - "{letters_black}Replaces its board."
    actions:
      - 'exylialobby:parkour_edit board %course_id%'

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>Courses</gradient>"
    lore:
      - "{error}{icon:click} Click to go back"
    actions:
      - 'exylialobby:parkour_edit back %course_id%'

  delete:
    slot: 35
    material: TNT
    name: "{letters}Course {letters_black}▸ <gradient:{error}:{error_light}>Delete</gradient>"
    lore:
      - "{letters_black}Danger zone"
      - ""
      - "{error}✎ Information"
      - " {letters}Removes the course and its"
      - " {letters}settings. Saved times stay."
      - ""
      - "{error}{icon:click} Click to delete"
      - "{letters_black}You will be asked to confirm."
    actions:
      - 'exylialobby:parkour_edit delete %course_id%'
