    lore:
      - "{letters_black}State setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Fixed time shown in the lobby."
      - " {letters}{highlight}6000 {letters}is noon. {highlight}-1 {letters}keeps the world's."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Ticks{letters_black}: %state_time%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %state_time_default%"
      - ""
