      - ""
      - "{primary}✎ Information"
      - " {letters}Fill the hunger bar and never"
      - " {letters}let it drop in the lobby."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Enabled{letters_black}: %state_full_hunger%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %state_full_hunger_default%"
