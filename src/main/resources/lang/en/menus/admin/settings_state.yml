    material: WATER_BUCKET
    name: "{letters}State {letters_black}▸ <gradient:{primary}:{secondary_light}>Weather</gradient>"
    lore:
      - "{letters_black}State setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Weather shown in the lobby. Off"
      - " {letters}keeps the world's weather."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Weather{letters_black}: %state_weather%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %state_weather_default%"
      - ""
      - "%state_weather_click%"
    actions:
      - "exylialobby:setting state weather"

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
