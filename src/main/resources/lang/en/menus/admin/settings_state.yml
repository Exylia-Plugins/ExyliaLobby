# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The state settings an admin tunes. Everything else is in
# modules/state/config.yml.

title: "{primary}&lSETTINGS {letters_black}» {highlight}State"
size: 36
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: ARMOR_STAND
    name: "<gradient:{primary}:{secondary_light}>State</gradient>"
    lore:
      - "{letters_black}State settings"
      - ""
      - "{primary}✎ Information"
      - " {letters}What a player is inside the lobby:"
      - " {letters}mode, health, time and weather."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Module{letters_black}: %state_state%"

  change-game-mode:
    slot: 11
    material: LEVER
    name: "{letters}State {letters_black}▸ <gradient:{primary}:{secondary_light}>Set game mode</gradient>"
    lore:
      - "{letters_black}State setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Set the game mode of players"
      - " {letters}entering the lobby."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Enabled{letters_black}: %state_change_game_mode%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %state_change_game_mode_default%"
      - ""
      - "%state_change_game_mode_click%"
    actions:
      - "exylialobby:setting state change-game-mode"

  game-mode:
    slot: 12
    material: IRON_SWORD
    name: "{letters}State {letters_black}▸ <gradient:{primary}:{secondary_light}>Game mode</gradient>"
    lore:
      - "{letters_black}State setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}The game mode players have"
      - " {letters}inside the lobby."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Mode{letters_black}: %state_game_mode%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %state_game_mode_default%"
      - ""
      - "%state_game_mode_click%"
    actions:
      - "exylialobby:setting state game-mode"

  override-staff-modes:
    slot: 14
    material: GOLDEN_HELMET
    name: "{letters}State {letters_black}▸ <gradient:{primary}:{secondary_light}>Include staff</gradient>"
    lore:
      - "{letters_black}State setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Also change players in creative"
      - " {letters}or spectator. Off leaves them."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Enabled{letters_black}: %state_override_staff_modes%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %state_override_staff_modes_default%"
      - ""
      - "%state_override_staff_modes_click%"
    actions:
      - "exylialobby:setting state override-staff-modes"

  full-health:
    slot: 15
    material: GOLDEN_APPLE
    name: "{letters}State {letters_black}▸ <gradient:{primary}:{secondary_light}>Full health</gradient>"
    lore:
      - "{letters_black}State setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Heal players to full health"
      - " {letters}when they enter."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:heart} {letters}Enabled{letters_black}: %state_full_health%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %state_full_health_default%"
      - ""
      - "%state_full_health_click%"
    actions:
      - "exylialobby:setting state full-health"

  full-hunger:
    slot: 20
    material: COOKED_BEEF
