menu-version: 1
# The server selector screen. Yours to restyle: new defaults wait in /exylialib updates.

title: '{primary}&lSERVERS {letters_black}» {highlight}Network {muted}%current_page%/%total_pages%'
size: 36
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}No more servers'
    lore:
      - "{letters_black}Ask an admin to add one."
    hide_tooltip: false

pagination:
  slots: '10-16,19-25'

  item_template:
    material: '%row_icon%'
    glow: '%row_glow%'
    name: "{letters}Server {letters_black}▸ <gradient:{info}:{info_light}>%row_name%</gradient>"
    lore:
      - "{letters_black}Server · %row_state%"
      - ""
      - "{info}✎ Information"
      - "%row_about%"
      - ""
      - "{info}✦ Status"
      - "  {letters_black}· {letters}Players{letters_black}: {info}%row_players%"
      - ""
      - "%row_prompt%"
    actions:
      - 'exylialobby:selector_join %row_ref%'

  navigation:
    previous:
      slot: 30
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Previous</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 32
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Next →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  header:
    slot: 4
    material: COMPASS
    name: "<gradient:{info}:{info_light}>Servers</gradient>"
    lore:
      - "{letters_black}Server selector"
      - ""
      - "{info}✎ Information"
      - " {letters}Pick a server to join."
      - " {letters}Counts are live."
      - ""
      - "{info}✦ Status"
      - "  {letters_black}· {letters}Playing now{letters_black}: {info}%total_players%"
