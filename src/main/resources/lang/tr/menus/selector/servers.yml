menu-version: 1
# Sunucu seçici ekranı. Sana kalmış: yeni varsayılanlar /exylialib updates içinde bekler.

title: '{primary}&lSUNUCULAR {letters_black}» {highlight}Ağ {muted}%current_page%/%total_pages%'
size: 36
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
