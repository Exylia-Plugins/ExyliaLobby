menu-version: 1
# DÜZENLEME — HER AÇILIŞTA YENİDEN OLUŞTURULUR.
#
# ExyliaLobby'nin tüm modülleri: canlı aç/kapat ya da ayarlarını aç.

title: '{primary}&lLOBİ {letters_black}» {highlight}Modüller {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Başka modül yok'
    lore:
      - "{letters_black}Tüm modüller burada listelenir."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: '%module_icon%'
    glow: '%module_glow%'
    name: "{letters}Modül {letters_black}▸ <gradient:{primary}:{secondary_light}>%module_name%</gradient>"
    lore:
      - "{letters_black}Lobi modülü"
      - ""
      - "{primary}✎ Bilgi"
      - "%module_description%"
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:redstone} {letters}Durum{letters_black}: %module_state%"
      - ""
      - "{primary}{icon:click} Sol tık {letters_black}· {letters}aç / kapat"
      - "{letters_black}Anında uygulanır, restart yok."
      - "{primary}{icon:right_click} Sağ tık {letters_black}· {letters}aç"
      - "{letters_black}Ekranını veya ayarlarını açar."
    actions:
      - 'left: exylialobby:module_toggle %module_id%'
      - 'right: exylialobby:module_open %module_id%'

  navigation:
    previous:
      slot: 48
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
