      - "  {letters_black}· {info}{icon:compass} {letters}Burada doğuş{letters_black}: %spawn_state%"

  set:
    slot: 12
    material: LIME_BED
    name: "{letters}Doğuş {letters_black}▸ <gradient:{success}:{success_light}>Doğuşu ayarla</gradient>"
    lore:
      - "{letters_black}Doğuş noktası"
