menu-version: 1
# DÜZENLEME — HER AÇILIŞTA YENİDEN OLUŞTURULUR.
#
# Lobi alanları: lobi kurallarının geçerli olduğu dünyalar ve kutular.

title: '{primary}&lALANLAR {letters_black}» {highlight}Lobi {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Başka alan yok'
    lore:
      - "{letters_black}Aşağıdan dünya ekle veya kutu seç."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: '%area_icon%'
    name: "{letters}Alan {letters_black}▸ <gradient:{primary}:{secondary_light}>%area_name%</gradient>"
    lore:
      - "{letters_black}%area_kind_label%"
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:map} {letters}Dünya{letters_black}: {info}%area_world%"
      - "  {letters_black}· {info}{icon:redstone} {letters}%area_state_label%{letters_black}: %area_state%"
      - ""
      - "{error}{icon:right_click} Sağ tık {letters_black}· {letters}kaldır"
      - "{letters_black}Onay istenecek."
    actions:
      - 'right: exylialobby:spawn_area_remove %area_kind% %area_id%'

  navigation:
    previous:
      slot: 48
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Sayfa {letters_black}▸ <gradient:{error}:{error_light}>← Önceki</gradient>"
      lore:
        - "  {letters_black}· {letters}Sayfa{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
