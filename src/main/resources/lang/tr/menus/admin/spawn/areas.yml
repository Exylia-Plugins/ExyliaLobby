      lore:
        - "  {letters_black}· {letters}Sayfa{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  add_box:
    slot: 45
    material: GOLDEN_AXE
    name: "{letters}Alan {letters_black}▸ <gradient:{success}:{success_light}>Kutu ekle</gradient>"
    lore:
      - "{letters_black}Lobi alanı"
      - ""
      - "{success}✎ Bilgi"
      - " {letters}Altın baltayla iki köşe seç;"
      - " {letters}lobi kuralları bu kutunun"
      - " {letters}içinde geçerli olur."
      - ""
      - "{success}{icon:click} Seçmek için tıkla"
      - "{letters_black}Sonra kutuya ad verirsin."
    actions:
      - 'exylialobby:spawn_area_add_box'

  add_world:
    slot: 46
    material: GRASS_BLOCK
    name: "{letters}Alan {letters_black}▸ <gradient:{success}:{success_light}>Bu dünyayı ekle</gradient>"
    lore:
      - "{letters_black}Lobi alanı"
      - ""
      - "{success}✎ Bilgi"
      - " {letters}Bulunduğun dünyanın tamamı"
      - " {letters}{highlight}lobi{letters} olur."
      - ""
      - "{success}{icon:click} Eklemek için tıkla"
      - "{letters_black}Anında uygulanır, restart yok."
    actions:
      - 'exylialobby:spawn_area_add_world'

  back:
    slot: 49
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Geri {letters_black}▸ <gradient:{error}:{error_light}>%back_name%</gradient>"
    lore:
      - "{error}{icon:click} Geri dönmek için tıkla"
    actions:
      - 'exylialobby:spawn_areas_back'
