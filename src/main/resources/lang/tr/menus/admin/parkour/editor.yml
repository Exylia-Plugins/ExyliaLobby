menu-version: 1
# DÜZENLEME — HER AÇILIŞTA YENİDEN OLUŞTURULUR.
#
# Tek bir parkur: nerede başlar, geçer ve biter, nasıl değerlendirilir.

title: '{primary}&lPARKOUR {letters_black}» {highlight}%course_id%'
size: 36

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: FEATHER
    name: "{letters}Parkur {letters_black}▸ <gradient:{primary}:{secondary_light}>%course_name%</gradient>"
    lore:
      - "{letters_black}Parkur"
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:check} {letters}Durum{letters_black}: %course_state%"
      - "  {letters_black}· {info}{icon:redstone} {letters}Etkin{letters_black}: %enabled%"

  start:
    slot: 11
    material: LIME_BED
    name: "{letters}Parkur {letters_black}▸ <gradient:{success}:{success_light}>Başlangıç</gradient>"
    lore:
      - "{letters_black}Parkur ayarı"
      - ""
      - "{success}✎ Bilgi"
      - " {letters}Koşunun başladığı yer. Konumunu"
      - " {letters}ve bakış yönünü kullanır."
      - ""
      - "{success}✦ Durum"
      - "  {letters_black}· {info}{icon:compass} {letters}Başlangıç{letters_black}: %start_state%"
      - ""
      - "{success}{icon:click} Buraya ayarlamak için tıkla"
      - "{letters_black}Başlangıcı değiştirir."
    actions:
      - 'exylialobby:parkour_edit start %course_id%'

  checkpoint:
    slot: 12
    material: LIGHT_WEIGHTED_PRESSURE_PLATE
    name: "{letters}Parkur {letters_black}▸ <gradient:{success}:{success_light}>Kontrol noktası ekle</gradient>"
    lore:
      - "{letters_black}Parkur ayarı"
      - ""
      - "{success}✎ Bilgi"
      - " {letters}Ayağının altına kontrol noktası"
      - " {letters}ekler. Sırayla geçilir."
      - ""
      - "{success}✦ Durum"
      - "  {letters_black}· {info}{icon:check} {letters}Kontrol noktaları{letters_black}: {info}%checkpoints%"
      - ""
      - "{success}{icon:click} Buraya eklemek için tıkla"
      - "{letters_black}Sonuncudan sonra eklenir."
    actions:
      - 'exylialobby:parkour_edit checkpoint %course_id%'

  finish:
    slot: 14
    material: WHITE_BANNER
    name: "{letters}Parkur {letters_black}▸ <gradient:{success}:{success_light}>Bitiş</gradient>"
    lore:
      - "{letters_black}Parkur ayarı"
      - ""
      - "{success}✎ Bilgi"
      - " {letters}Koşunun bittiği yer. Konumunu"
      - " {letters}ve bakış yönünü kullanır."
      - ""
      - "{success}✦ Durum"
      - "  {letters_black}· {info}{icon:star} {letters}Bitiş{letters_black}: %finish_state%"
      - ""
      - "{success}{icon:click} Buraya ayarlamak için tıkla"
      - "{letters_black}Bitişi değiştirir."
    actions:
      - 'exylialobby:parkour_edit finish %course_id%'

  kill:
    slot: 15
    material: MAGMA_BLOCK
    name: "{letters}Parkur {letters_black}▸ <gradient:{primary}:{secondary_light}>Ölüm blokları</gradient>"
    lore:
      - "{letters_black}Parkur ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Baktığın blok koşucuyu"
      - " {letters}kontrol noktasına geri atar."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:barrier} {letters}Bloklar{letters_black}: {info}%kills%"
      - ""
      - "{primary}{icon:click} Blok eklemek için tıkla"
      - "{letters_black}Önce bir bloğa bak."
    actions:
      - 'exylialobby:parkour_edit kill %course_id%'

  medals:
    slot: 20
    material: GOLD_INGOT
    name: "{letters}Parkur {letters_black}▸ <gradient:{primary}:{secondary_light}>Madalyalar</gradient>"
    lore:
      - "{letters_black}Parkur ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Altın, gümüş ve bronz için"
      - " {letters}hedef süreler (saniye)."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:gold} {letters}Hedefler{letters_black}: {info}%medals%"
      - ""
      - "{primary}{icon:click} Düzenlemek için tıkla"
      - "{letters_black}Üç sayı sorar."
    actions:
      - 'exylialobby:parkour_edit medals %course_id%'

  difficulty:
    slot: 21
    material: NETHER_STAR
    name: "{letters}Parkur {letters_black}▸ <gradient:{primary}:{secondary_light}>Zorluk</gradient>"
    lore:
      - "{letters_black}Parkur ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Kartında görünen etiket."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:crit} {letters}Zorluk{letters_black}: {info}%difficulty%"
      - ""
      - "{primary}{icon:click} Düzenlemek için tıkla"
      - "{letters_black}Serbest metin, örn. Zor."
    actions:
      - 'exylialobby:parkour_edit difficulty %course_id%'

  rewards:
    slot: 23
    material: CHEST
    name: "{letters}Parkur {letters_black}▸ <gradient:{primary}:{secondary_light}>Ödüller</gradient>"
    lore:
      - "{letters_black}Parkur ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}İlk bitiriş ve tekrar ödülleri,"
      - " {letters}asgari süre ve sınırlar."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:book} {letters}Parkurlar dosyasında düzenlenir"
      - ""
      - "{primary}{icon:click} Açmak için tıkla"
      - "{letters_black}Orada bu parkuru seç."
    actions:
      - 'exylialobby:parkour_edit rewards %course_id%'

  enabled:
    slot: 24
    material: LEVER
    name: "{letters}Parkur {letters_black}▸ <gradient:{primary}:{secondary_light}>Etkin</gradient>"
    lore:
      - "{letters_black}Parkur ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Kapalıyken oyuncular başlatamaz."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:redstone} {letters}Etkin{letters_black}: %enabled%"
      - ""
      - "{primary}{icon:click} Açıp kapatmak için tıkla"
      - "{letters_black}Anında değişir."
    actions:
      - 'exylialobby:parkour_edit enabled %course_id%'

  board:
    slot: 27
    material: OAK_SIGN
    name: "{letters}Parkur {letters_black}▸ <gradient:{info}:{info_light}>Sıralama buraya</gradient>"
    lore:
      - "{letters_black}Hologram"
      - ""
      - "{info}✎ Bilgi"
      - " {letters}Bu parkurun sıralama"
      - " {letters}hologramı ayağının altına."
      - ""
      - "{info}{icon:click} Yerleştirmek için tıkla"
      - "{letters_black}Mevcut sıralamayı değiştirir."
    actions:
      - 'exylialobby:parkour_edit board %course_id%'

  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Geri {letters_black}▸ <gradient:{error}:{error_light}>Parkurlar</gradient>"
    lore:
      - "{error}{icon:click} Geri dönmek için tıkla"
    actions:
      - 'exylialobby:parkour_edit back %course_id%'

  delete:
    slot: 35
    material: TNT
    name: "{letters}Parkur {letters_black}▸ <gradient:{error}:{error_light}>Sil</gradient>"
    lore:
      - "{letters_black}Tehlikeli bölge"
      - ""
      - "{error}✎ Bilgi"
      - " {letters}Parkuru ve ayarlarını siler."
      - " {letters}Kayıtlı süreler kalır."
      - ""
      - "{error}{icon:click} Silmek için tıkla"
      - "{letters_black}Onay istenecek."
    actions:
      - 'exylialobby:parkour_edit delete %course_id%'
