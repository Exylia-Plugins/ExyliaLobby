menu-version: 1
# Tek bir parkur. # Sana kalmış: yeni varsayılanlar /exylialib updates içinde bekler.

title: '{primary}&lPARKOUR {letters_black}» {highlight}%course_name%'
size: 27

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: FEATHER
    name: "{letters}Parkur {letters_black}▸ %course_name%"
    lore:
      - "{letters_black}Parkur"
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {warning}{icon:star} {letters}Zorluk{letters_black}: {warning}%course_difficulty%"
      - "  {letters_black}· {info}{icon:clock} {letters}En iyi{letters_black}: {info}%course_best%"
      - "  {letters_black}· {highlight}{icon:gold} {letters}Madalya{letters_black}: %course_medal%"
      - "  {letters_black}· {success}{icon:book} {letters}Bitirme{letters_black}: {success}%course_finishes%"

  play:
    slot: 12
    material: LIME_DYE
    name: "{letters}Parkur {letters_black}▸ <gradient:{success}:{success_light}>Oyna</gradient>"
    lore:
      - "{letters_black}Koş"
      - ""
      - "{success}✎ Bilgi"
      - " {letters}Rekorunu kır, "
      - " {letters}{highlight}sıralamada{letters} yüksel."
      - ""
      - "{success}{icon:click} Oynamak için tıkla"
      - "{letters_black}Başlangıca gönderilirsin."
    actions:
      - 'exylialobby:parkour_play %course_id%'

  splits:
    slot: 13
    material: CLOCK
    name: "{letters}Parkur {letters_black}▸ <gradient:{info}:{info_light}>Ara sürelerin</gradient>"
    lore:
      - "{letters_black}En iyi koşun"
      - ""
      - "{info}⌚ Kontrol noktaları"
      - "%course_splits%"

  top:
    slot: 14
    material: GOLD_INGOT
    name: "{letters}Parkur {letters_black}▸ <gradient:{highlight}:{warning_light}>Sıralama</gradient>"
    lore:
      - "{letters_black}Sıralamalar"
      - ""
      - "{highlight}✎ Bilgi"
      - " {letters}En hızlı koşular: tüm zamanlar,"
      - " {letters}aylık, haftalık ve günlük."
      - ""
      - "{highlight}{icon:click} Açmak için tıkla"
      - "{letters_black}Yerini gör."
    actions:
      - 'exylialobby:parkour_top %course_id%'

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Geri {letters_black}▸ <gradient:{error}:{error_light}>Parkurlar</gradient>"
    lore:
      - "{error}{icon:click} Geri dönmek için tıkla"
    actions:
      - 'exylialobby:parkour_list'

  reset:
    slot: 26
    material: TNT
    name: "{letters}Parkur {letters_black}▸ <gradient:{error}:{error_light}>Süremi sıfırla</gradient>"
    lore:
      - "{letters_black}Tehlikeli bölge"
      - ""
      - "{error}✎ Bilgi"
      - " {letters}En iyini ve ara sürelerini"
      - " {letters}ve sıralamadaki yerini siler."
      - ""
      - "{error}{icon:click} Sıfırlamak için tıkla"
      - "{letters_black}Onay istenecek."
    actions:
      - 'exylialobby:parkour_reset %course_id%'
