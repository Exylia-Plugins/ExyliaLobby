cards:
  grapple:
    name: Kanca
    text:
    - Duvara veya zemine at,
    - seni oraya çeker.
    click: Sağ tık
    use: at ve çek
  ender:
    name: Ender Yolculuğu
    text:
    - Kendi incinin üstünde havada
    - süzül, güvenle in.
    click: Sağ tık
    use: fırlat ve bin
  paint:
    name: Boya Tabancası
    text:
    - Atışlar zemini birkaç saniye
    - boyar. Hiçbir şey kırılmaz.
    click: Sağ tık
    use: boya sık
  knockback:
    name: İtme Sopası
    text:
    - İzin veren oyuncuları it.
    - Asla zarar vermez.
    click: Oyuncuya vur
    use: onu it
  leap:
    name: Sıçrama Tüyü
    text:
    - Baktığın yöne fırla,
    - yumuşak in.
    click: Sağ tık
    use: ileri sıçra
  snowball:
    name: Kartopu Topu
    text:
    - İzin veren oyuncuları hafifçe
    - iten bir kartopu yağmuru.
    click: Sağ tık
    use: yağmuru ateşle
  trampoline:
    name: Trambolin
    text:
    - Ayaklarının altında birkaç
    - saniyelik zıplatan ped.
    click: Sağ tık
    use: pedi yerleştir
