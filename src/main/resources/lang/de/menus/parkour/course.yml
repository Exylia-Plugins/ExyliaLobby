menu-version: 1
# Ein Parkour-Kurs. # Gestalte ihn nach Belieben um: neue Standards warten in /exylialib updates.

title: '{primary}&lPARKOUR {letters_black}» {highlight}%course_name%'
size: 27

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: FEATHER
    name: "{letters}Kurs {letters_black}▸ %course_name%"
    lore:
      - "{letters_black}Kurs"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {warning}{icon:star} {letters}Schwierigkeit{letters_black}: {warning}%course_difficulty%"
      - "  {letters_black}· {info}{icon:clock} {letters}Bestzeit{letters_black}: {info}%course_best%"
      - "  {letters_black}· {highlight}{icon:gold} {letters}Medaille{letters_black}: %course_medal%"
      - "  {letters_black}· {success}{icon:book} {letters}Abschlüsse{letters_black}: {success}%course_finishes%"

  play:
    slot: 12
    material: LIME_DYE
    name: "{letters}Kurs {letters_black}▸ <gradient:{success}:{success_light}>Spielen</gradient>"
    lore:
      - "{letters_black}Los geht's"
      - ""
      - "{success}✎ Information"
      - " {letters}Schlage deine Bestzeit und"
      - " {letters}steige im {highlight}Ranking {letters}auf."
      - ""
      - "{success}{icon:click} Klicke zum Spielen"
      - "{letters_black}Du wirst zum Start gebracht."
    actions:
      - 'exylialobby:parkour_play %course_id%'

  splits:
    slot: 13
    material: CLOCK
    name: "{letters}Kurs {letters_black}▸ <gradient:{info}:{info_light}>Deine Splits</gradient>"
    lore:
      - "{letters_black}Dein bester Lauf"
      - ""
      - "{info}⌚ Checkpoints"
      - "%course_splits%"

  top:
    slot: 14
    material: GOLD_INGOT
    name: "{letters}Kurs {letters_black}▸ <gradient:{highlight}:{warning_light}>Bestenliste</gradient>"
    lore:
      - "{letters_black}Platzierungen"
      - ""
      - "{highlight}✎ Information"
      - " {letters}Die schnellsten Läufe, gesamt,"
      - " {letters}monatlich, wöchentlich und täglich."
      - ""
      - "{highlight}{icon:click} Klicke zum Öffnen"
      - "{letters_black}Sieh, wo du stehst."
    actions:
      - 'exylialobby:parkour_top %course_id%'

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Zurück {letters_black}▸ <gradient:{error}:{error_light}>Kurse</gradient>"
    lore:
      - "{error}{icon:click} Klicke zum Zurückgehen"
    actions:
      - 'exylialobby:parkour_list'

  reset:
    slot: 26
    material: TNT
    name: "{letters}Kurs {letters_black}▸ <gradient:{error}:{error_light}>Meine Zeit zurücksetzen</gradient>"
    lore:
      - "{letters_black}Gefahrenzone"
      - ""
      - "{error}✎ Information"
      - " {letters}Löscht deine Bestzeit, Splits und"
      - " {letters}Plätze in den Bestenlisten dieses Kurses."
      - ""
      - "{error}{icon:click} Klicke zum Zurücksetzen"
      - "{letters_black}Du musst es noch bestätigen."
    actions:
      - 'exylialobby:parkour_reset %course_id%'
