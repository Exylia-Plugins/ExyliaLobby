menu-version: 1
# Die Parkour-Bestenliste. # Du kannst sie frei gestalten: neue Standardwerte warten in /exylialib updates.

title: '{primary}&lTOP {letters_black}» {highlight}%board_title% {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Keine weiteren Runs'
    lore:
      - "{letters_black}Schaffe ihn für einen Platz."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: '%row_icon%'
    glow: '%row_glow%'
    name: "%row_name%"
    lore:
      - "%row_subtitle%"
      - ""
      - "%row_label_status%"
      - "%row_stats%"

  navigation:
    previous:
      slot: 48
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0='
      name: "{letters}Seite {letters_black}▸ <gradient:{error}:{error_light}>← Zurück</gradient>"
      lore:
        - "  {letters_black}· {letters}Seite{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'previous_page'
    next:
      slot: 50
      sound: 'minecraft:item.book.page_turn|1.0|1.0'
      material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0='
      name: "{letters}Seite {letters_black}▸ <gradient:{success}:{success_light}>Weiter →</gradient>"
      lore:
        - "  {letters_black}· {letters}Seite{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - 'next_page'

items:
  period_all:
    slot: 45
    material: CLOCK
    glow: '%glow_all%'
    name: "{letters}Zeitraum {letters_black}▸ <gradient:{info}:{info_light}>Gesamt</gradient>"
    lore:
      - "{letters_black}Filter"
      - ""
      - "{info}{icon:click} Klicke zum Anzeigen"
      - "{letters_black}Die Gesamt-Bestenliste."
    actions:
      - 'exylialobby:parkour_period all'

  period_monthly:
    slot: 46
    material: CLOCK
    glow: '%glow_monthly%'
    name: "{letters}Zeitraum {letters_black}▸ <gradient:{info}:{info_light}>Monatlich</gradient>"
    lore:
      - "{letters_black}Filter"
      - ""
      - "{info}{icon:click} Klicke zum Anzeigen"
      - "{letters_black}Die Monats-Bestenliste."
    actions:
      - 'exylialobby:parkour_period monthly'

  period_weekly:
    slot: 47
    material: CLOCK
    glow: '%glow_weekly%'
    name: "{letters}Zeitraum {letters_black}▸ <gradient:{info}:{info_light}>Wöchentlich</gradient>"
    lore:
      - "{letters_black}Filter"
      - ""
      - "{info}{icon:click} Klicke zum Anzeigen"
      - "{letters_black}Die Wochen-Bestenliste."
    actions:
      - 'exylialobby:parkour_period weekly'

  period_daily:
    slot: 51
    material: CLOCK
    glow: '%glow_daily%'
    name: "{letters}Zeitraum {letters_black}▸ <gradient:{info}:{info_light}>Täglich</gradient>"
    lore:
      - "{letters_black}Filter"
      - ""
      - "{info}{icon:click} Klicke zum Anzeigen"
      - "{letters_black}Die Tages-Bestenliste."
    actions:
      - 'exylialobby:parkour_period daily'

  me:
    slot: 49
    material: 'playerhead-%player_name%'
    name: "{letters}Du {letters_black}▸ <gradient:{highlight}:{warning_light}>%my_rank%</gradient>"
    lore:
      - "{letters_black}Dein Platz · %period_name%"
      - ""
      - "{highlight}✦ Status"
      - "  {letters_black}· {info}{icon:star} {letters}Bestzeit{letters_black}: {info}%my_best%"
      - "  {letters_black}· {highlight}{icon:star} {letters}Rang{letters_black}: {highlight}%my_rank%"

  back:
    slot: 53
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Zurück {letters_black}▸ <gradient:{error}:{error_light}>%back_name%</gradient>"
    lore:
      - "{error}{icon:click} Klicke zum Zurückgehen"
    actions:
      - 'exylialobby:parkour_top_back'
