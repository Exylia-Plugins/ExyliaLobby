# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Die Sichtbarkeits-Einstellungen, die ein Admin anpasst. Alles andere steht in
# modules/visibility/config.yml.

title: "{primary}&lEINSTELLUNGEN {letters_black}» {highlight}Sichtbarkeit"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: ENDER_EYE
    name: "<gradient:{primary}:{secondary_light}>Sichtbarkeit</gradient>"
    lore:
      - "{letters_black}Sichtbarkeits-Einstellungen"
      - ""
      - "{primary}✎ Information"
      - " {letters}Wen ein Spieler in der Lobby sieht."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Modul{letters_black}: %visibility_state%"

  default-mode:
    slot: 12
    material: ENDER_EYE
    name: "{letters}Sichtbarkeit {letters_black}▸ <gradient:{primary}:{secondary_light}>Standardansicht</gradient>"
    lore:
      - "{letters_black}Sichtbarkeits-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Was ein Spieler sieht, der nie"
      - " {letters}gewählt hat: alle, Freunde oder niemand."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Modus{letters_black}: %visibility_default_mode%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %visibility_default_mode_default%"
      - ""
      - "%visibility_default_mode_click%"
    actions:
      - "exylialobby:setting visibility default-mode"

  cooldown:
    slot: 13
    material: CLOCK
    name: "{letters}Sichtbarkeit {letters_black}▸ <gradient:{primary}:{secondary_light}>Wechsel-Cooldown</gradient>"
    lore:
      - "{letters_black}Sichtbarkeits-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Zeit, die ein Spieler zwischen"
      - " {letters}zwei Wechseln warten muss."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Wartezeit{letters_black}: %visibility_cooldown%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %visibility_cooldown_default%"
      - ""
      - "%visibility_cooldown_click%"
    actions:
      - "exylialobby:setting visibility cooldown"

  clan-friends:
    slot: 14
    material: SHIELD
    name: "{letters}Sichtbarkeit {letters_black}▸ <gradient:{primary}:{secondary_light}>Clanmitglieder sind Freunde</gradient>"
    lore:
      - "{letters_black}Sichtbarkeits-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Clanmitglieder gelten als Freunde,"
      - " {letters}wenn ein Clan-Plugin installiert ist."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Aktiviert{letters_black}: %visibility_clan_friends%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %visibility_clan_friends_default%"
      - ""
      - "%visibility_clan_friends_click%"
    actions:
      - "exylialobby:setting visibility clan-friends"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Zurück {letters_black}▸ <gradient:{error}:{error_light}>Einstellungen</gradient>"
    lore:
      - "{error}{icon:click} Klicke, um zurückzugehen"
    actions:
