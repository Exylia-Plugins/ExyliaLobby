# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Die Onboarding-Einstellungen, die ein Admin anpasst. Alles andere steht in
# modules/onboarding/config.yml.

title: "{primary}&lEINSTELLUNGEN {letters_black}» {highlight}Onboarding"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: FILLED_MAP
    name: "<gradient:{primary}:{secondary_light}>Onboarding</gradient>"
    lore:
      - "{letters_black}Onboarding-Einstellungen"
      - ""
      - "{primary}✎ Information"
      - " {letters}Wie Spieler beim ersten Join an"
      - " {letters}ExyliaJourney übergeben werden."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Modul{letters_black}: %onboarding_state%"

  journey:
    slot: 12
    material: WRITTEN_BOOK
    name: "{letters}Onboarding {letters_black}▸ <gradient:{primary}:{secondary_light}>Journey</gradient>"
    lore:
      - "{letters_black}Onboarding-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Die ID der ExyliaJourney,"
      - " {letters}die Spieler willkommen heißt."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Journey{letters_black}: %onboarding_journey%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %onboarding_journey_default%"
      - ""
      - "%onboarding_journey_click%"
    actions:
      - "exylialobby:setting onboarding journey"

  first-join-only:
    slot: 13
    material: LIME_BED
    name: "{letters}Onboarding {letters_black}▸ <gradient:{primary}:{secondary_light}>Nur erster Join</gradient>"
    lore:
      - "{letters_black}Onboarding-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Nur Spieler, die zum ersten"
      - " {letters}Mal joinen. Aus: alle."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Aktiviert{letters_black}: %onboarding_first_join_only%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %onboarding_first_join_only_default%"
      - ""
      - "%onboarding_first_join_only_click%"
    actions:
      - "exylialobby:setting onboarding first-join-only"

  delay:
    slot: 14
    material: CLOCK
    name: "{letters}Onboarding {letters_black}▸ <gradient:{primary}:{secondary_light}>Verzögerung</gradient>"
    lore:
      - "{letters_black}Onboarding-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Zeit nach dem Join, bevor"
      - " {letters}die Journey startet."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Verzögerung{letters_black}: %onboarding_delay%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %onboarding_delay_default%"
      - ""
      - "%onboarding_delay_click%"
    actions:
      - "exylialobby:setting onboarding delay"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Zurück {letters_black}▸ <gradient:{error}:{error_light}>Einstellungen</gradient>"
    lore:
      - "{error}{icon:click} Klicke, um zurückzugehen"
    actions:
      - "exylialobby:settings_hub"
