# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Die Bewegungs-Einstellungen, die ein Admin anpasst. Alles andere steht in
# modules/movement/config.yml.

title: "{primary}&lEINSTELLUNGEN {letters_black}» {highlight}Bewegung"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: RABBIT_FOOT
    name: "<gradient:{primary}:{secondary_light}>Bewegung</gradient>"
    lore:
      - "{letters_black}Bewegungs-Einstellungen"
      - ""
      - "{primary}✎ Information"
      - " {letters}Doppelsprung: wie weit er"
      - " {letters}schleudert und wie oft."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Modul{letters_black}: %movement_state%"

  double-jump-enabled:
    slot: 11
    material: FEATHER
    name: "{letters}Bewegung {letters_black}▸ <gradient:{primary}:{secondary_light}>Doppelsprung</gradient>"
    lore:
      - "{letters_black}Bewegungs-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Drücke in der Luft erneut"
      - " {letters}Springen für einen 2. Sprung."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Aktiviert{letters_black}: %movement_double_jump_enabled%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %movement_double_jump_enabled_default%"
      - ""
      - "%movement_double_jump_enabled_click%"
    actions:
      - "exylialobby:setting movement double-jump.enabled"

  double-jump-forward:
    slot: 12
    material: ARROW
    name: "{letters}Bewegung {letters_black}▸ <gradient:{primary}:{secondary_light}>Vorwärtsschub</gradient>"
    lore:
      - "{letters_black}Bewegungs-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Horizontaler Schub in die"
      - " {letters}Blickrichtung des Spielers."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:hopper} {letters}Schub{letters_black}: %movement_double_jump_forward%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %movement_double_jump_forward_default%"
      - ""
      - "%movement_double_jump_forward_click%"
    actions:
      - "exylialobby:setting movement double-jump.forward"

  double-jump-vertical:
    slot: 14
    material: SLIME_BALL
    name: "{letters}Bewegung {letters_black}▸ <gradient:{primary}:{secondary_light}>Aufwärtsschub</gradient>"
    lore:
      - "{letters_black}Bewegungs-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Wie hoch der 2. Sprung den"
      - " {letters}Spieler schleudert."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:hopper} {letters}Schub{letters_black}: %movement_double_jump_vertical%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %movement_double_jump_vertical_default%"
      - ""
      - "%movement_double_jump_vertical_click%"
    actions:
      - "exylialobby:setting movement double-jump.vertical"

  double-jump-cooldown:
    slot: 15
    material: CLOCK
    name: "{letters}Bewegung {letters_black}▸ <gradient:{primary}:{secondary_light}>Cooldown</gradient>"
    lore:
      - "{letters_black}Bewegungs-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Zeit, bis derselbe Spieler"
      - " {letters}erneut doppelspringen kann."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Wartezeit{letters_black}: %movement_double_jump_cooldown%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %movement_double_jump_cooldown_default%"
      - ""
      - "%movement_double_jump_cooldown_click%"
    actions:
      - "exylialobby:setting movement double-jump.cooldown"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Zurück {letters_black}▸ <gradient:{error}:{error_light}>Einstellungen</gradient>"
    lore:
      - "{error}{icon:click} Klicke, um zurückzugehen"
    actions:
      - "exylialobby:settings_hub"
