# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Die Lobby-Bereiche: die Welten und Boxen, in denen die Lobby-Regeln gelten.

title: '{primary}&lBEREICHE {letters_black}» {highlight}Lobby {muted}%current_page%/%total_pages%'
size: 54
type: PAGINATION

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '{muted}Keine weiteren Bereiche'
