    material: GOLDEN_AXE
    name: "{letters}Bereich {letters_black}▸ <gradient:{success}:{success_light}>Box hinzufügen</gradient>"
    lore:
      - "{letters_black}Lobby-Bereich"
      - ""
      - "{success}✎ Information"
