      - ""
      - "{error}{icon:right_click} Rechtsklick {letters_black}· {letters}entfernen"
      - "{letters_black}Du musst es noch bestätigen."
    actions:
      - 'right: exylialobby:spawn_area_remove %area_kind% %area_id%'

  navigation:
