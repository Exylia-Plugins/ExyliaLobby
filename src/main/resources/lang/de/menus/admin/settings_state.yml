      - ""
      - "{primary}✎ Information"
      - " {letters}Wie sich ein Spieler in der Lobby"
      - " {letters}verhält: Modus, Leben, Zeit, Wetter."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Modul{letters_black}: %state_state%"

  change-game-mode:
    slot: 11
    material: LEVER
    name: "{letters}State {letters_black}▸ <gradient:{primary}:{secondary_light}>Spielmodus setzen</gradient>"
    lore:
      - "{letters_black}State-Einstellung"
