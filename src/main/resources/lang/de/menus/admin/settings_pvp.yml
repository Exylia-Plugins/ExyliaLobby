# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Die Lobby-PvP-Einstellungen, die ein Admin anpasst. Alles andere steht in
# modules/pvp/config.yml.

title: "{primary}&lEINSTELLUNGEN {letters_black}» {highlight}Lobby-PvP"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: DIAMOND_SWORD
    name: "<gradient:{primary}:{secondary_light}>Lobby-PvP</gradient>"
    lore:
      - "{letters_black}PvP-Einstellungen"
      - ""
      - "{primary}✎ Information"
      - " {letters}So läuft das Lobby-PvP ab:"
      - " {letters}Ausrüstzeit und Combat-Tag."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Modul{letters_black}: %pvp_state%"

  equip-seconds:
    slot: 11
    material: IRON_SWORD
    name: "{letters}PvP {letters_black}▸ <gradient:{primary}:{secondary_light}>Ausrüstzeit</gradient>"
    lore:
      - "{letters_black}PvP-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Sekunden mit dem Schwert in der"
      - " {letters}Hand, bis das Kit angelegt wird."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Wartezeit{letters_black}: %pvp_equip_seconds%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %pvp_equip_seconds_default%"
      - ""
      - "%pvp_equip_seconds_click%"
    actions:
      - "exylialobby:setting pvp equip-seconds"

  unequip-seconds:
    slot: 12
    material: LEATHER_CHESTPLATE
    name: "{letters}PvP {letters_black}▸ <gradient:{primary}:{secondary_light}>Ablegezeit</gradient>"
    lore:
      - "{letters_black}PvP-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Sekunden ohne Schwert, bis das"
      - " {letters}Kit wieder abgelegt wird."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Wartezeit{letters_black}: %pvp_unequip_seconds%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %pvp_unequip_seconds_default%"
      - ""
      - "%pvp_unequip_seconds_click%"
    actions:
      - "exylialobby:setting pvp unequip-seconds"

  tag-seconds:
    slot: 14
    material: BLAZE_POWDER
    name: "{letters}PvP {letters_black}▸ <gradient:{primary}:{secondary_light}>Combat-Tag</gradient>"
    lore:
      - "{letters_black}PvP-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Sekunden im Kampf nach einem"
      - " {letters}Treffer, ausgeteilt oder erhalten."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Tag{letters_black}: %pvp_tag_seconds%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %pvp_tag_seconds_default%"
      - ""
      - "%pvp_tag_seconds_click%"
    actions:
      - "exylialobby:setting pvp tag-seconds"

  quit-counts:
    slot: 15
    material: SKELETON_SKULL
    name: "{letters}PvP {letters_black}▸ <gradient:{primary}:{secondary_light}>Quit zählt</gradient>"
    lore:
      - "{letters_black}PvP-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Ein Quit im Kampf zählt als"
      - " {letters}Tod für den Spieler."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Aktiv{letters_black}: %pvp_quit_counts%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %pvp_quit_counts_default%"
      - ""
      - "%pvp_quit_counts_click%"
    actions:
      - "exylialobby:setting pvp quit-counts"

