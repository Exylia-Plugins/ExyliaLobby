# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Die Spawn-Einstellungen, die ein Admin anpasst. Alles andere steht in
# modules/spawn/config.yml.

title: "{primary}&lEINSTELLUNGEN {letters_black}» {highlight}Spawn"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: RESPAWN_ANCHOR
    name: "<gradient:{primary}:{secondary_light}>Spawn</gradient>"
    lore:
      - "{letters_black}Spawn-Einstellungen"
      - ""
      - "{primary}✎ Information"
      - " {letters}Wo Spieler erscheinen und wann"
      - " {letters}sie zum Spawn zurückgeschickt werden."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Modul{letters_black}: %spawn_state%"

  on-join:
    slot: 11
    material: OAK_DOOR
    name: "{letters}Spawn {letters_black}▸ <gradient:{primary}:{secondary_light}>Beim Beitritt</gradient>"
    lore:
      - "{letters_black}Spawn-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Wer beim Betreten der Lobby"
      - " {letters}zum Spawn geschickt wird."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Modus{letters_black}: %spawn_on_join%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %spawn_on_join_default%"
      - ""
      - "%spawn_on_join_click%"
    actions:
      - "exylialobby:setting spawn on-join"

  warmup:
    slot: 12
    material: CLOCK
    name: "{letters}Spawn {letters_black}▸ <gradient:{primary}:{secondary_light}>Aufwärmzeit</gradient>"
    lore:
      - "{letters_black}Spawn-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Sekunden, die du stillstehen musst,"
      - " {letters}bis /spawn klappt. {highlight}0 {letters}ist sofort."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Wartezeit{letters_black}: %spawn_warmup%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %spawn_warmup_default%"
      - ""
      - "%spawn_warmup_click%"
    actions:
      - "exylialobby:setting spawn warmup"

  respawn:
    slot: 13
    material: RED_BED
    name: "{letters}Spawn {letters_black}▸ <gradient:{primary}:{secondary_light}>Respawn am Spawn</gradient>"
    lore:
      - "{letters_black}Spawn-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Spieler, die in der Lobby sterben,"
      - " {letters}respawnen am Spawn."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Aktiviert{letters_black}: %spawn_respawn%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %spawn_respawn_default%"
      - ""
      - "%spawn_respawn_click%"
    actions:
      - "exylialobby:setting spawn respawn"

  void-return:
    slot: 14
    material: ENDER_PEARL
    name: "{letters}Spawn {letters_black}▸ <gradient:{primary}:{secondary_light}>Void-Rückkehr</gradient>"
    lore:
