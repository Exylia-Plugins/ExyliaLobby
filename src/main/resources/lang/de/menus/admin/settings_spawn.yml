    name: "{letters}Spawn {letters_black}▸ <gradient:{primary}:{secondary_light}>Void-Höhe</gradient>"
    lore:
      - "{letters_black}Spawn-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Die Y-Höhe, unter der ein Spieler"
      - " {letters}zum Spawn zurückgeschickt wird."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:hopper} {letters}Höhe{letters_black}: %spawn_void_y%"
