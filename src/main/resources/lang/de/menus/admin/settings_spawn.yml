      - ""
      - "{primary}✎ Information"
      - " {letters}Schickt Spieler zum Spawn zurück,"
      - " {letters}wenn sie unter die Höhe fallen."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Aktiviert{letters_black}: %spawn_void_return%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %spawn_void_return_default%"
