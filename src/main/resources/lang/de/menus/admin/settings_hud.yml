# DO NOT EDIT — REGENERIERT BEIM JEDEN START.
#
# Die HUD-Einstellungen, die ein Admin anpasst. Alles andere steht in
# modules/hud/config.yml.

title: "{primary}&lEINSTELLUNGEN {letters_black}» {highlight}HUD"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: NAME_TAG
    name: "<gradient:{primary}:{secondary_light}>HUD</gradient>"
    lore:
      - "{letters_black}HUD-Einstellungen"
      - ""
      - "{primary}✎ Information"
      - " {letters}Was Spieler in der Lobby auf"
      - " {letters}dem Bildschirm sehen."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Modul{letters_black}: %hud_state%"

  tab-enabled:
    slot: 12
    material: PAPER
    name: "{letters}HUD {letters_black}▸ <gradient:{primary}:{secondary_light}>Spielerliste</gradient>"
    lore:
      - "{letters_black}HUD-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Zeigt einen Header und Footer"
      - " {letters}in der Spielerliste an."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Aktiviert{letters_black}: %hud_tab_enabled%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %hud_tab_enabled_default%"
      - ""
      - "%hud_tab_enabled_click%"
    actions:
      - "exylialobby:setting hud tab.enabled"

  announcements-enabled:
    slot: 13
    material: BELL
    name: "{letters}HUD {letters_black}▸ <gradient:{primary}:{secondary_light}>Ankündigungen</gradient>"
    lore:
      - "{letters_black}HUD-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Sendet Ankündigungen per"
      - " {letters}Timer im Chat."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:redstone} {letters}Aktiviert{letters_black}: %hud_announcements_enabled%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %hud_announcements_enabled_default%"
      - ""
      - "%hud_announcements_enabled_click%"
    actions:
      - "exylialobby:setting hud announcements.enabled"

  announcements-interval:
    slot: 14
    material: CLOCK
    name: "{letters}HUD {letters_black}▸ <gradient:{primary}:{secondary_light}>Ankündigungsabstand</gradient>"
    lore:
      - "{letters_black}HUD-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Zeit zwischen zwei Ankündigungen."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Alle{letters_black}: %hud_announcements_interval%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %hud_announcements_interval_default%"
      - ""
      - "%hud_announcements_interval_click%"
    actions:
      - "exylialobby:setting hud announcements.interval"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Zurück {letters_black}▸ <gradient:{error}:{error_light}>Einstellungen</gradient>"
    lore:
      - "{error}{icon:click} Klicke, um zurückzugehen"
    actions:
      - "exylialobby:settings_hub"
